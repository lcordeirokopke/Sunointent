versao: 8
# Snapshot fixo do modelo de cada nó (docs/arquiteturas.md, 1. Model client / router).
# O juiz (judge) precisa ser de família diferente do extractor.
modelos:
  extractor: gemini-3.8-flash
  adapter: gemini-3.8-flash
  synthesizer: gemini-3.8-flash
  judge: openai/gpt-oss-120b
# Preço em US$ por 1 milhão de tokens, por snapshot. Tokens de raciocínio contam como saída.
# Fonte: ai.google.dev/gemini-api/docs/pricing, consultado em 2026-10-12; o preço do
# gemini-3.8-flash é promocional até 2026-12-31.
# O juiz é cobrado pelo preço do Groq, consultado em 2026-10-16 em console.groq.com/docs/model/openai/gpt-oss-120b.
precos_usd_por_milhao:
  gemini-3.8-flash:
    entrada: "0.75"
    saida: "3.75"
  openai/gpt-oss-120b:
    entrada: "0.15"
    saida: "0.60"
# Nível de raciocínio por chamada (minimal, low, medium ou high); chamada sem chave aqui usa o padrão
# do modelo. A correção do extractor só ajusta claims recusados, com o motivo, e não relê o documento todo.
# A correção do planejador (E4) só resolve os problemas do gate no plano enviado.
# A correção do redator (E5) reescreve a peça com o relatório corretivo; o plano não muda.
# O juiz (M6) raciocina em nível médio, para conferir, frase a frase, se a peça explica os termos que usa; a saída
# máxima pedida é 8.192 tokens, e o raciocínio conta dentro dela.
raciocinio:
  extractor_correcao: low
  adapter_correcao: low
  synthesizer_correcao: low
  judge: medium
# PENDENTE: cotação USD/BRL provisória, usada só para estimar llm_spans.custo_brl e runs.custo_total_brl.
cotacao_usd_brl: "5.40"
