nivel: iniciante
versao: 5
# Campos da E4 (docs/fluxos/plano-editorial.md, LevelSpec da E4). Valores de partida.
foco: "impacto prático no bolso do leitor"
tags_priorizadas: [impacto_pratico]
tags_descartaveis: [metodologico]
# Contrato de formato (docs/arquiteturas.md, O LevelSpec): lido pela E4 (o plano usa o max_claims do artigo),
# pela E5.1 (orçamento de cada formato e corte pela prioridade, sempre com o núcleo) e pela M2.
peso_papel: {principal: 3, apoio: 2, contexto: 1}
formatos:
  artigo:
    max_claims: 5
    palavras: {min: 350, max: 550}
  carrossel:
    max_claims: 4
    slides: {min: 5, max: 7}
    caracteres: {gancho: 120, corpo: 220, conclusao: 160}
  roteiro:
    max_claims: 3
    duracao_s: 60
    palavras_por_segundo: 2.5
    abertura_s: 6
    fechamento_s: 6
# Regra da M5 (docs/arquiteturas.md, E6): no Iniciante, todo termo do glossário acima de iniciante com analogia
# no plano tem, na mesma unidade da primeira ocorrência, uma destas expressões (duas palavras ou mais).
analogia:
  marcadores: ["é como", "funciona como", "imagine que", "na prática"]
# Regra da M3 (docs/metricas.md): piso do Índice de Facilidade de Leitura (Flesch adaptado ao português) por formato,
# medido sobre o texto das unidades, e a meta de tamanho de frase que o redator recebe. Os outros níveis só medem.
legibilidade:
  ifl_minimo: {artigo: 30, carrossel: 45, roteiro: 45}
  frase_max_palavras: 18
