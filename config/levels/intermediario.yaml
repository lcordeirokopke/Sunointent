nivel: intermediario
versao: 6
# Campos da E4 (docs/fluxos/plano-editorial.md, LevelSpec da E4). Valores de partida.
foco: "o que o fato muda para quem já investe"
tags_priorizadas: [indicador_chave, contexto_macro]
tags_descartaveis: []
# Contrato de formato (docs/arquiteturas.md, O LevelSpec): lido pela E4 (o plano usa o max_claims do artigo),
# pela E5.1 (orçamento de cada formato e corte pela prioridade, sempre com o núcleo) e pela M2.
peso_papel: {principal: 3, apoio: 2, contexto: 1}
formatos:
  artigo:
    max_claims: 7
    palavras: {min: 450, max: 750}
  carrossel:
    max_claims: 5
    slides: {min: 5, max: 7}
    caracteres: {gancho: 120, corpo: 220, conclusao: 160}
  roteiro:
    max_claims: 5
    duracao_s: 60
    palavras_por_segundo: 2.5
    abertura_s: 6
    fechamento_s: 6
# Regra da M5 (docs/arquiteturas.md, E6): todo termo do glossário acima de intermediario com explicação no plano tem,
# na mesma unidade da primeira ocorrência, uma destas expressões (duas palavras ou mais).
analogia:
  marcadores: ["ou seja", "isto é", "quer dizer", "em outras palavras"]
# Regra de vocabulário do redator (docs/fluxos/plano-editorial.md, LevelSpec da E4): os termos do glossário com
# nivel_minimo acima de explicar_acima_de são explicados na primeira vez que aparecem; os outros, usados sem explicar.
vocabulario:
  explicar_acima_de: intermediario
# Sinal de nível da M3 (docs/metricas.md): faixa de IFL do artigo neste nível ({min} inclusivo, {max} exclusivo).
# Só alimenta a matriz de confusão de níveis; não reprova nada. As faixas dos 3 níveis se encaixam.
sinal_ifl:
  artigo: {min: 27, max: 45}
