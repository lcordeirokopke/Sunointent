      - texto: "É como a assembleia anual de prestação de contas do condomínio, em que se aprova o balanço e se elege o síndico."
        limite: "Na empresa, o peso do voto depende da quantidade de ações com direito a voto, não de um voto por pessoa."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: assembleia_geral_extraordinaria
    termo: assembleia geral extraordinária
    variantes:
      - assembleias gerais extraordinárias
      - assembleia-geral extraordinária
      - assembleia de acionistas
      - assembleias de acionistas
    categoria: societario
    nivel_minimo: intermediario
    definicao_simples: "Reunião dos sócios convocada fora da reunião anual para decidir outros assuntos, como mudanças no estatuto ou uniões com outras empresas."
    definicao_tecnica: "Assembleia de acionistas convocada para deliberar sobre matérias que não são objeto da assembleia ordinária, como reforma do estatuto, incorporação, fusão, cisão e aumento de capital."
    analogias:
      - texto: "É como a assembleia extraordinária do condomínio, chamada quando surge uma decisão importante fora do calendário."
        limite: "O peso de cada voto depende das ações com voto, e certas decisões exigem quórum especial definido em lei."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: conselho_de_administracao
    termo: conselho de administração
    variantes:
      - conselhos de administração
      - conselheiros de administração
    categoria: societario
    nivel_minimo: intermediario
    definicao_simples: "Grupo eleito pelos sócios para definir a estratégia da empresa e fiscalizar os diretores."
    definicao_tecnica: "Órgão colegiado de deliberação da companhia, eleito pela assembleia, responsável pela orientação geral dos negócios, eleição e fiscalização da diretoria e por deliberações previstas em lei e estatuto, como a declaração de juros sobre capital próprio."
    analogias:
      - texto: "É como o conselho de um clube: não cuida do dia a dia, mas define os rumos e cobra quem administra."
        limite: "Os conselheiros têm deveres legais com a companhia e podem ser responsabilizados; não é um papel só consultivo."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Conselho de administração"
      url: "https://borainvestir.b3.com.br/glossario/conselho-de-administracao/"

  - id: conselho_fiscal
    termo: conselho fiscal
    variantes:
      - conselhos fiscais
      - conselheiros fiscais
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Grupo eleito pelos sócios para fiscalizar as contas e os atos dos administradores da empresa."
    definicao_tecnica: "Órgão de fiscalização da companhia, eleito pela assembleia, que acompanha os atos dos administradores e opina sobre as demonstrações financeiras e propostas submetidas à assembleia."
    analogias:
      - texto: "É como o conselho fiscal de um condomínio, que confere as contas do síndico."
        limite: "Não substitui a auditoria independente, que tem outro papel e outra responsabilidade."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Conselho fiscal"
      url: "https://borainvestir.b3.com.br/glossario/conselho-fiscal/"

  - id: estatuto_social
    termo: estatuto social
    variantes:
      - estatutos sociais
      - reforma do estatuto
    categoria: societario
    nivel_minimo: intermediario
    definicao_simples: "Documento com as regras de funcionamento de uma empresa, como objetivo, órgãos de comando e direitos dos sócios."
    definicao_tecnica: "Principal documento constitutivo da sociedade por ações, que estabelece objeto social, capital, espécies e classes de ações, órgãos de administração e regras de funcionamento."
    analogias:
      - texto: "É como a convenção do condomínio: o regulamento que todos os sócios devem seguir."
        limite: "O estatuto não pode contrariar a lei; algumas regras valem mesmo que ele seja omisso."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Estatuto social"
      url: "https://borainvestir.b3.com.br/glossario/estatuto-social/"

  - id: incorporacao
    termo: incorporação
    variantes:
      - incorporação de sociedade
      - incorporação da companhia
      - companhia incorporadora
      - sociedade incorporada
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Operação em que uma empresa absorve outra, que deixa de existir, e assume todos os seus direitos e dívidas."
    definicao_tecnica: "Operação pela qual uma ou mais sociedades são absorvidas por outra, que lhes sucede em todos os direitos e obrigações; aprovada pelas assembleias com base em protocolo e justificação e em laudo de avaliação."
    analogias:
      - texto: "É como uma loja comprar a vizinha e derrubar a parede: só sobra uma loja, que fica com o estoque, os clientes e as contas da outra."
        limite: "Os sócios da empresa absorvida em geral recebem ações da incorporadora em troca, conforme uma relação definida, e não dinheiro."
        status: rascunho
    ambiguo: true
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: incorporacao_de_acoes
    termo: incorporação de ações
    variantes:
      - incorporações de ações
      - subsidiária integral
      - subsidiárias integrais
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Operação em que uma empresa passa a ser dona de todas as ações de outra, entregando aos antigos sócios ações dela mesma em troca."
    definicao_tecnica: "Incorporação de todas as ações do capital de uma companhia ao patrimônio de outra, que a converte em subsidiária integral; os acionistas da incorporada recebem ações da incorporadora conforme protocolo e justificação aprovados nas assembleias das duas companhias."
    analogias:
      - texto: "É como trocar a sua cota de uma lanchonete por cotas da rede que comprou a lanchonete inteira: a lanchonete continua aberta, mas agora pertence toda à rede."
        limite: "Diferente da incorporação de sociedade, a empresa incorporada continua existindo como subsidiária; e o acionista que discordar pode ter direito de retirada."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: fusao
    termo: fusão
    variantes:
      - fusão de empresas
      - fusão entre
      - fusões e aquisições
      - fusões
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Operação em que duas ou mais empresas se juntam para formar uma empresa nova."
    definicao_tecnica: "Operação pela qual se unem duas ou mais sociedades para formar sociedade nova, que lhes sucede em todos os direitos e obrigações."
    analogias:
      - texto: "É como duas bandas que se juntam e lançam um novo nome: nenhuma das antigas continua, nasce uma terceira."
        limite: "No uso do mercado, fusão às vezes é dito para qualquer união de empresas, mas juridicamente difere da incorporação, em que uma absorve a outra."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: cisao
    termo: cisão
    variantes:
      - cisões
      - cisão parcial
      - cisão total
      - companhia cindida
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Operação em que uma empresa transfere parte ou todo o seu patrimônio para outras empresas, dividindo-se."
    definicao_tecnica: "Operação pela qual a companhia transfere parcelas do seu patrimônio para uma ou mais sociedades, constituídas para esse fim ou já existentes, extinguindo-se se houver versão de todo o patrimônio ou dividindo-se o capital se a versão for parcial."
    analogias:
      - texto: "É como uma empresa que separa um departamento e o transforma em outra empresa, com bens e dívidas próprios."
        limite: "Os sócios costumam receber participação nas empresas resultantes; ninguém perde a parte automaticamente."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Cisão"
      url: "https://borainvestir.b3.com.br/glossario/cisao/"

  - id: direito_de_retirada
    termo: direito de retirada
    variantes:
      - direito de recesso
      - exercício do direito de retirada
      - acionista dissidente
      - acionistas dissidentes
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Direito do sócio que discordou de certas decisões da assembleia de sair da empresa, recebendo o valor de suas ações."
    definicao_tecnica: "Direito do acionista dissidente de deliberações previstas em lei (como incorporação, fusão e cisão, em certas condições) de retirar-se da companhia mediante reembolso do valor de suas ações, se o reclamar no prazo legal."
    analogias:
      - texto: "É como a porta de saída de um condomínio que decidiu uma grande reforma: quem votou contra pode vender a parte de volta pelo valor definido, em vez de ser obrigado a ficar."
        limite: "O direito só vale para algumas decisões e dentro de um prazo; o valor pago segue regras da lei e do estatuto, não o preço que o acionista quiser."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: reembolso
    termo: reembolso
    variantes:
      - valor de reembolso
      - reembolso das ações
      - pagamento do reembolso
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Pagamento que a empresa faz ao sócio que exerceu o direito de sair, pelo valor das ações dele."
    definicao_tecnica: "Operação pela qual, nos casos previstos em lei, a companhia paga aos acionistas dissidentes de deliberação da assembleia o valor de suas ações, apurado segundo critérios da lei e do estatuto."
    analogias:
      - texto: "É como o clube devolver ao sócio que saiu o valor do título, calculado por uma regra combinada antes."
        limite: "O valor segue critério legal ou estatutário e pode ser diferente da cotação na bolsa."
        status: rascunho
    ambiguo: true
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: relacao_de_troca
    termo: relação de troca
    variantes:
      - relações de troca
      - relação de substituição
      - relações de substituição
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Quantas ações da empresa que fica o sócio recebe para cada ação da empresa que deixa de existir ou é absorvida."
    definicao_tecnica: "Número de ações atribuídas aos sócios da sociedade incorporada, fundida ou cindida em substituição às que se extinguem, e critérios usados para determiná-lo; consta do protocolo da operação."
    analogias:
      - texto: "É como a taxa de troca de fichas entre dois parques: cada ficha antiga vale um número definido de fichas novas."
        limite: "Como a conta raramente dá número inteiro, sobram frações de ações, que são tratadas por regras próprias da operação."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: protocolo_e_justificacao
    termo: protocolo e justificação
    variantes:
      - protocolo da operação
      - protocolo de incorporação
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Documentos em que as empresas descrevem as condições de uma união ou divisão entre elas e explicam os motivos, para aprovação dos sócios."
    definicao_tecnica: "Protocolo firmado pelos administradores com as condições da incorporação, fusão ou cisão (ações atribuídas, relação de substituição, critérios de avaliação) e justificação com os motivos e fins da operação, submetidos às assembleias."
    analogias:
      - texto: "É como o contrato e a exposição de motivos de um casamento de empresas, levados aos sócios para aprovação."
        limite: "O protocolo é assinado pelos administradores, mas só produz efeito depois de aprovado nas assembleias."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: opa
    termo: oferta pública de aquisição
    variantes:
      - OPA
      - OPAs
      - ofertas públicas de aquisição
      - oferta pública de aquisição de ações
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Oferta feita a todos os sócios de uma empresa com ações na bolsa para comprar suas ações em condições definidas."
    definicao_tecnica: "Oferta pública dirigida aos acionistas de companhia aberta para aquisição de ações, obrigatória em casos como cancelamento de registro, aumento de participação e alienação de controle, ou voluntária; disciplinada por resolução da CVM."
    analogias:
      - texto: "É como alguém anunciar a todos os moradores de um prédio que quer comprar os apartamentos por um preço definido, dando a todos a mesma chance de vender."
        limite: "Ninguém é obrigado a vender, e as regras de preço e prazo dependem do tipo de oferta."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comissão de Valores Mobiliários, Resolução CVM 215"
      url: "https://conteudo.cvm.gov.br/legislacao/resolucoes/resol215.html"

  - id: escriturador
    termo: escriturador
    variantes:
      - escrituradores
      - instituição escrituradora
      - escrituração de ações
      - escrituração de valores mobiliários
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Instituição responsável por manter o registro oficial de quem é dono das ações de uma empresa."
    definicao_tecnica: "Instituição autorizada pela CVM a prestar o serviço de escrituração de valores mobiliários, mantendo os registros de titularidade e processando eventos como proventos e grupamentos."
    analogias:
      - texto: "É como o cartório que guarda o livro de registro dos sócios da empresa."
        limite: "O registro é eletrônico e, para ações em bolsa, convive com o registro do depositário central."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comissão de Valores Mobiliários, Resolução CVM 33"
      url: "https://conteudo.cvm.gov.br/legislacao/resolucoes/resol033.html"

  - id: joint_venture
    termo: joint venture
    variantes:
      - joint ventures
      - empreendimento controlado em conjunto
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Parceria em que duas ou mais empresas se juntam para tocar um negócio específico, dividindo custos, riscos e resultados."
    definicao_tecnica: "Negócio em conjunto em que as partes compartilham o controle e os direitos sobre os ativos líquidos de uma entidade, com recursos, riscos e responsabilidades divididos."
    analogias:
      - texto: "É como dois restaurantes que abrem juntos uma barraca numa feira: cada um continua com o seu negócio, mas a barraca é dos dois."
        limite: "As regras de controle e de divisão dos resultados vêm do acordo entre as partes e podem não ser meio a meio."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Joint venture"
      url: "https://borainvestir.b3.com.br/glossario/joint-venture/"

  - id: alienacao
    termo: alienação
    variantes:
      - alienação de participação
      - alienação de controle
      - alienação de ações
      - alienação da participação
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Venda ou transferência de um bem ou de uma participação numa empresa para outra pessoa."
    definicao_tecnica: "Transferência ou cessão de bens ou direitos, como a venda de participação societária ou do controle de uma companhia."
    analogias:
      - texto: "No mercado, é o nome formal para vender ou passar adiante algo que se possui, como uma fatia de outra empresa."
        limite: "A palavra tem outros sentidos no dia a dia; aqui vale só o sentido jurídico de transferir a propriedade."
        status: rascunho
    ambiguo: true
    fonte:
      nome: "B3, Bora Investir, Glossário: Alienação"
      url: "https://borainvestir.b3.com.br/glossario/alienacao/"

  - id: dividendos
    termo: dividendos
    variantes:
      - dividendo
      - dividendos extraordinários
      - distribuição de dividendos
    categoria: societario
    nivel_minimo: intermediario
    definicao_simples: "Parte do lucro de uma empresa que é paga aos sócios."
    definicao_tecnica: "Parcela do lucro líquido distribuída aos acionistas na proporção de suas ações, conforme a lei, o estatuto e as deliberações dos órgãos sociais; para pessoa física, segue a tributação vigente."
    analogias:
      - texto: "É como a divisão do lucro de uma padaria entre os sócios no fim do período, proporcional à parte de cada um."
        limite: "Pagar dividendos não aumenta a riqueza do sócio por si só: o dinheiro sai do caixa da empresa, e a ação tende a se ajustar."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Dividendos"
      url: "https://borainvestir.b3.com.br/glossario/dividendos/"

  - id: jcp
    termo: juros sobre capital próprio
    variantes:
      - JCP
      - juros sobre o capital próprio
    categoria: societario
    nivel_minimo: intermediario
    definicao_simples: "Forma de a empresa pagar parte do lucro aos sócios que permite à empresa pagar menos imposto; para o sócio, há desconto de imposto na fonte."
    definicao_tecnica: "Remuneração aos acionistas calculada sobre o patrimônio líquido e limitada a uma taxa de referência, dedutível da base do imposto de renda e da contribuição social da empresa, com retenção de imposto na fonte para o beneficiário; pode ser imputada ao dividendo obrigatório."
    analogias:
      - texto: "É um primo do dividendo: também distribui lucro aos sócios, mas por outra porta, com efeito diferente no imposto."
        limite: "Para o acionista pessoa física, o valor líquido recebido sofre retenção de imposto, ao contrário da regra usual dos dividendos."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Juros sobre capital próprio (JCP)"
      url: "https://borainvestir.b3.com.br/glossario/juros-sobre-capital-proprio-jcp/"

  - id: dividendo_obrigatorio
    termo: dividendo obrigatório
    variantes:
      - dividendo mínimo obrigatório
      - dividendos obrigatórios
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Parte mínima do lucro que a lei ou o estatuto obriga a empresa a pagar aos sócios."
    definicao_tecnica: "Parcela dos lucros que os acionistas têm direito de receber em cada exercício, estabelecida no estatuto ou, se omisso, pela regra da Lei das S.A. sobre o lucro líquido ajustado."
    analogias:
      - texto: "É como um piso combinado em contrato: a empresa pode pagar mais, mas não menos do que a regra manda, salvo exceções da lei."
        limite: "Há situações previstas em lei em que o pagamento pode ser adiado, por exemplo quando a situação financeira não permite."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: reserva_legal
    termo: reserva legal
    variantes:
      - reservas de lucros
    categoria: societario
    nivel_minimo: avancado
    definicao_simples: "Parte do lucro que a empresa é obrigada por lei a guardar antes de distribuir, para reforçar seu capital."
    definicao_tecnica: "Reserva de lucros constituída obrigatoriamente com parcela do lucro líquido do exercício, até um limite em relação ao capital social, para assegurar a integridade do capital."
    analogias:
      - texto: "É como a parte do salário que a família guarda antes de qualquer gasto, por regra."
        limite: "O limite e o uso da reserva são definidos em lei; ela não pode ser distribuída livremente aos sócios."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: proventos
    termo: proventos
    variantes:
      - distribuição de proventos
      - remuneração aos acionistas
      - distribuições aos acionistas
    categoria: societario
    nivel_minimo: intermediario
    definicao_simples: "Pagamentos e benefícios que o sócio recebe da empresa, como parte do lucro ou ações extras."
    definicao_tecnica: "Remunerações e direitos recebidos pelos detentores de ações, como dividendos, juros sobre capital próprio, bonificações e direitos de subscrição."
    analogias:
      - texto: "É o nome guarda-chuva para tudo que a empresa entrega aos sócios por serem sócios."
        limite: "Cada tipo de provento tem regra e tributação próprias."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Proventos"
      url: "https://borainvestir.b3.com.br/glossario/proventos/"

  - id: data_ex
    termo: data ex
    variantes:
      - data-ex
      - ex-dividendos
      - ex-direitos
      - data com
      - data-com
    categoria: societario
    nivel_minimo: intermediario
    definicao_simples: "Data a partir da qual quem compra a ação já não tem direito ao pagamento anunciado; quem tinha a ação até o dia anterior recebe."
