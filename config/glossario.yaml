versao: 4
termos:
  # ---------------------------------------------------------------- juros
  - id: juros
    termo: juros
    variantes:
      - juro
      - taxa de juros
      - taxas de juros
      - taxa de juro
    categoria: juros
    nivel_minimo: iniciante
    definicao_simples: "Valor cobrado por quem empresta dinheiro, ou recebido por quem aplica, pelo uso do dinheiro durante um tempo."
    definicao_tecnica: "Remuneração do capital emprestado ou aplicado, normalmente expressa como percentual por período sobre o valor principal."
    analogias: []
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Taxa de juro"
      url: "https://borainvestir.b3.com.br/glossario/taxa-de-juro/"

  - id: selic
    termo: Selic
    variantes:
      - taxa Selic
      - taxa básica de juros
      - taxa básica
      - meta para a taxa Selic
      - meta da Selic
      - Selic efetiva
    categoria: juros
    nivel_minimo: intermediario
    definicao_simples: "Taxa de juros de referência do país, definida pelo Banco Central, que influencia os juros de empréstimos, financiamentos e aplicações."
    definicao_tecnica: "Taxa média das operações compromissadas de um dia útil lastreadas em títulos públicos federais registrados no Sistema Especial de Liquidação e de Custódia; o Copom define a meta para a Selic e o Banco Central atua no mercado aberto para manter a taxa efetiva em linha com essa meta. É o principal instrumento de política monetária."
    analogias:
      - texto: "A Selic é como o juro de referência que o Banco Central define para os empréstimos entre bancos: quando ele sobe, os juros cobrados de pessoas e empresas tendem a subir junto."
        limite: "Ela não é a taxa que o cliente paga no banco nem uma medida da inflação; as taxas de cada operação somam custos, risco e margem e podem mudar em ritmos diferentes."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Taxa Selic"
      url: "https://www.bcb.gov.br/controleinflacao/taxaselic"

  - id: copom
    termo: Copom
    variantes:
      - Comitê de Política Monetária
    categoria: juros
    nivel_minimo: intermediario
    definicao_simples: "Grupo formado pelo presidente e pelos diretores do Banco Central que se reúne periodicamente para decidir a taxa de juros de referência do país."
    definicao_tecnica: "Órgão do Banco Central, formado pelo presidente e pelos diretores, que define a meta para a taxa Selic com base na avaliação do cenário macroeconômico, das expectativas de inflação e do balanço de riscos; divulga a decisão em comunicado e publica ata da reunião."
    analogias:
      - texto: "O Copom é como o conselho que ajusta o termostato da economia: decide se o juro de referência sobe, cai ou fica igual para manter a inflação perto do alvo."
        limite: "O comitê não controla diretamente preços nem a economia; a decisão leva tempo para fazer efeito e outros fatores também influenciam o resultado."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Comitê de Política Monetária (Copom)"
      url: "https://www.bcb.gov.br/controleinflacao/copom"

  - id: politica_monetaria
    termo: política monetária
    variantes:
      - políticas monetárias
      - condução da política monetária
    categoria: juros
    nivel_minimo: intermediario
    definicao_simples: "Conjunto de ações do Banco Central para mexer no custo do dinheiro e na quantidade de dinheiro em circulação, com o objetivo principal de manter os preços estáveis."
    definicao_tecnica: "Ações do Banco Central para afetar as taxas de juros e as condições de liquidez da economia, visando primordialmente a estabilidade de preços; usa como instrumentos a taxa Selic, as operações de mercado aberto, os depósitos voluntários, os depósitos compulsórios e o redesconto."
    analogias:
      - texto: "A política monetária é como o pedal de freio e acelerador do crédito: juros mais altos freiam o consumo e o investimento, juros mais baixos aceleram."
        limite: "Os efeitos chegam com atraso e de forma desigual entre setores; a economia também responde a fatores fora do controle do Banco Central."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Perguntas frequentes: Política Monetária"
      url: "https://www.bcb.gov.br/acessoinformacao/perguntasfrequentes-respostas/faq_politicamonetariaBC"

  - id: politica_monetaria_restritiva
    termo: política monetária restritiva
    variantes:
      - política monetária contracionista
      - caráter restritivo
      - restrição monetária
      - política monetária expansionista
      - política monetária estimulativa
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Situação em que os juros de referência estão altos o bastante para frear o consumo e o investimento e assim segurar a alta de preços; no sentido oposto, juros baixos estimulam a economia."
    definicao_tecnica: "Postura em que a taxa de juros real efetiva está acima da taxa de juros real neutra, contraindo a demanda e a inflação; quando está abaixo da neutra, a política é expansionista ou estimulativa."
    analogias:
      - texto: "É como dirigir com o pé no freio: o carro continua andando, mas mais devagar do que andaria sozinho."
        limite: "O grau do freio depende de uma referência que não é observada diretamente (o juro neutro), por isso a avaliação de quanto a política está restritiva é sempre uma estimativa."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Relatório de Inflação, boxe Medidas de taxa de juros real neutra no Brasil"
      url: "https://www.bcb.gov.br/content/ri/relatorioinflacao/202306/ri202306b6p.pdf"

  - id: taxa_de_juros_neutra
    termo: taxa de juros neutra
    variantes:
      - juro neutro
      - juros neutros
      - taxa neutra
      - taxa de juros real neutra
      - taxa de juros estrutural
      - juro estrutural
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Nível de juros que nem acelera nem freia a economia, mantendo os preços estáveis com crescimento no ritmo normal."
    definicao_tecnica: "Taxa de juros real consistente, no médio prazo, com inflação na meta e crescimento do produto igual ao crescimento potencial; é variável não observável, estimada por modelos, e serve de referência para avaliar o grau de restrição da política monetária."
    analogias:
      - texto: "É como a velocidade de cruzeiro de um carro numa estrada plana: nem acelera nem freia, só mantém o ritmo."
        limite: "Não é um número fixo nem conhecido com precisão; muda com o tempo conforme fatores estruturais da economia e só pode ser estimado."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Relatório de Inflação, boxe Medidas de taxa de juros real neutra no Brasil"
      url: "https://www.bcb.gov.br/content/ri/relatorioinflacao/202306/ri202306b6p.pdf"

  - id: juros_reais
    termo: juros reais
    variantes:
      - juro real
      - taxa de juros real
      - taxas de juros reais
    categoria: juros
    nivel_minimo: intermediario
    definicao_simples: "O quanto os juros rendem de verdade depois de descontar a alta dos preços no mesmo período."
    definicao_tecnica: "Taxa de juros descontada a inflação do mesmo período; mede o ganho ou o custo em poder de compra de uma aplicação ou de um empréstimo."
    analogias:
      - texto: "Se o salário sobe mas os preços sobem quase o mesmo tanto, o ganho de verdade é só a diferença; com os juros é igual: o juro real é o que sobra depois de descontar a inflação."
        limite: "O desconto correto não é uma simples subtração quando as taxas são altas, e a inflação usada pode ser a passada ou a esperada, o que muda o resultado."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Taxa de juros real"
      url: "https://borainvestir.b3.com.br/glossario/taxa-de-juros-real/"

  - id: juros_nominais
    termo: juros nominais
    variantes:
      - juro nominal
      - taxa de juros nominal
    categoria: juros
    nivel_minimo: intermediario
    definicao_simples: "Os juros anunciados ou combinados, sem descontar o efeito da alta dos preços."
    definicao_tecnica: "Taxa de juros contratada ou divulgada, que expressa o rendimento bruto do período sem considerar a variação do poder de compra da moeda."
    analogias:
      - texto: "É como olhar o número do salário no contracheque sem pensar no quanto os preços subiram: mostra o valor, não o poder de compra."
        limite: "Não diz se houve ganho de poder de compra; para isso é preciso comparar com a inflação do período."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Juros nominais"
      url: "https://borainvestir.b3.com.br/glossario/juros-nominais/"

  - id: juros_compostos
    termo: juros compostos
    variantes:
      - juros sobre juros
      - capitalização composta
    categoria: juros
    nivel_minimo: intermediario
    definicao_simples: "Forma de calcular juros em que os juros de cada período passam a render juros também nos períodos seguintes."
    definicao_tecnica: "Regime de capitalização em que os juros incidem sobre o principal acrescido dos juros acumulados em períodos anteriores, gerando crescimento exponencial do saldo."
    analogias:
      - texto: "É como uma bola de neve descendo o morro: quanto mais rola, mais neve gruda e mais rápido ela cresce."
        limite: "Vale tanto para aplicações quanto para dívidas; numa dívida, a bola de neve trabalha contra quem deve."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Juros compostos"
      url: "https://borainvestir.b3.com.br/glossario/juros-compostos/"

  - id: cdi
    termo: CDI
    variantes:
      - Certificado de Depósito Interbancário
      - Certificados de Depósito Interbancário
      - taxa DI
      - DI over
    categoria: juros
    nivel_minimo: intermediario
    definicao_simples: "Taxa dos empréstimos de um dia entre bancos, usada como referência para o rendimento de muitas aplicações."
    definicao_tecnica: "Título de emissão bancária usado em empréstimos de curto prazo entre instituições financeiras; a taxa DI, média das operações de um dia útil entre instituições de grupos diferentes, é a principal referência de rentabilidade das aplicações pós-fixadas, como CDBs, LCIs, LCAs e fundos DI."
    analogias:
      - texto: "O CDI é como o preço de atacado do dinheiro entre bancos; muitas aplicações dizem quanto pagam usando esse preço como régua (por exemplo, uma fração ou um múltiplo dele)."
        limite: "Pessoas físicas não compram CDI diretamente; ele é uma referência, e a taxa acompanha de perto a Selic, mas não é igual a ela."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Certificado de Depósito Interbancário (CDI)"
      url: "https://borainvestir.b3.com.br/glossario/certificado-de-deposito-interbancario-cdi/"

  - id: curva_de_juros
    termo: curva de juros
    variantes:
      - curvas de juros
      - estrutura a termo das taxas de juros
      - estrutura a termo
      - curva de juros futuros
      - juros futuros
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Comparação entre as taxas de juros cobradas para prazos diferentes, do mais curto ao mais longo."
    definicao_tecnica: "Relação entre os rendimentos dos títulos e seus prazos de vencimento; sua inclinação e seu nível refletem expectativas sobre juros e inflação futuros e prêmios de risco exigidos para prazos mais longos."
    analogias:
      - texto: "É como a tabela de preços de um aluguel por prazo: o preço do dinheiro emprestado por um mês costuma ser diferente do preço por cinco anos, e a curva mostra essa tabela inteira de uma vez."
        limite: "Na curva os preços mudam todos os dias com o mercado, e o formato pode inverter (prazos longos mais baratos que os curtos), o que não costuma acontecer com aluguel."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: premio_a_termo
    termo: prêmio a termo
    variantes:
      - prêmios a termo
      - prêmio de prazo
      - term premium
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Ganho extra que o investidor pede para emprestar dinheiro por muito tempo de uma vez, em vez de renovar empréstimos curtos."
    definicao_tecnica: "Componente das taxas de juros de longo prazo que representa a compensação adicional exigida pelos investidores para manter títulos longos em vez de renovar sucessivamente títulos curtos; não é observável e é estimado por modelos da estrutura a termo."
    analogias:
      - texto: "É como o desconto que o dono de um imóvel exige a mais para assinar um contrato longo: ele cobra pelo risco de ficar preso ao combinado se as condições mudarem."
        limite: "No aluguel o dono costuma dar desconto em contratos longos; no prêmio a termo é o contrário, o investidor cobra mais pelo prazo longo. A analogia vale só para a ideia de cobrar pelo risco de ficar preso."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Trabalhos para Discussão, prêmio a termo na curva de juros brasileira"
      url: "https://www.bcb.gov.br/content/publicacoes/WorkingPaperSeries/WP637v3.pdf"

  - id: premio_de_risco
    termo: prêmio de risco
    variantes:
      - prêmios de risco
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Ganho extra que quem empresta ou investe exige para aceitar a incerteza de não receber o esperado."
    definicao_tecnica: "Parcela da taxa de juros ou do retorno exigido que compensa o investidor pelas incertezas associadas ao ativo ou à economia, como a de inflação mais alta ou a de crédito; eleva o custo de financiamento, inclusive da dívida pública."
    analogias:
      - texto: "É como o adicional que um entregador cobra para levar uma encomenda a um bairro mais arriscado: quanto maior a incerteza, maior o acréscimo."
        limite: "O prêmio não é observado diretamente e muda com o humor do mercado; um prêmio alto não significa que o calote vai acontecer."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, O que é inflação"
      url: "https://www.bcb.gov.br/controleinflacao/oqueinflacao"

  - id: forward_guidance
    termo: forward guidance
    variantes:
      - prescrição futura
      - orientação futura
      - indicação de passos futuros
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Quando o Banco Central avisa o caminho que pretende seguir com os juros nas próximas reuniões, para orientar as apostas do mercado."
    definicao_tecnica: "Ferramenta de comunicação usada por bancos centrais para delinear o curso futuro da política monetária; pode ser um compromisso público condicional sobre ações futuras do comitê ou apenas a apresentação de projeções e prováveis ações, e atua sobre a curva de juros."
    analogias:
      - texto: "É como o aviso de obras na estrada que diz o que vem nos próximos quilômetros, para os motoristas ajustarem a velocidade antes."
        limite: "O aviso costuma ser condicional: se o cenário mudar, o Banco Central pode mudar o caminho, ao contrário de uma placa fixa."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Relatório de Inflação, boxe Estimação dos efeitos do forward guidance na curva de juros"
      url: "https://www.bcb.gov.br/content/ri/relatorioinflacao/202012/ri202012b10p.pdf"

  - id: operacao_compromissada
    termo: operação compromissada
    variantes:
      - operações compromissadas
      - compromissada
      - compromissadas
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Venda de um papel com o compromisso de comprá-lo de volta numa data marcada, que na prática funciona como um empréstimo de curto prazo."
    definicao_tecnica: "Operação de compra (ou venda) de títulos de renda fixa com compromisso de revenda (ou recompra) dos mesmos títulos em data futura, anterior ou igual ao vencimento; é o principal instrumento do Banco Central para ajustar a liquidez e manter a Selic efetiva perto da meta."
    analogias:
      - texto: "É como deixar uma joia na casa de penhores e buscá-la de volta depois, pagando um pouco a mais: na prática, é um empréstimo com garantia."
        limite: "Aqui a garantia são títulos negociados entre instituições financeiras e o prazo costuma ser muito curto; não há risco de perder o bem por atraso como na penhora comum."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: operacao_de_mercado_aberto
    termo: operação de mercado aberto
    variantes:
      - operações de mercado aberto
      - mercado aberto
      - open market
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Compra e venda diária de papéis do governo pelo Banco Central para manter os juros de curtíssimo prazo no nível decidido."
    definicao_tecnica: "Compra e venda de títulos públicos federais pelo Banco Central, de forma definitiva ou compromissada, para regular a liquidez do sistema bancário e manter a taxa Selic efetiva em linha com a meta definida pelo Copom."
    analogias:
      - texto: "É como o regulador de uma caixa d'água que abre ou fecha a torneira o tempo todo para o nível ficar na marca desejada."
        limite: "O nível que o Banco Central mira é a taxa de juros de um dia, não a quantidade total de dinheiro na economia."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Perguntas frequentes: Política Monetária"
      url: "https://www.bcb.gov.br/acessoinformacao/perguntasfrequentes-respostas/faq_politicamonetariaBC"

  - id: deposito_compulsorio
    termo: depósito compulsório
    variantes:
      - depósitos compulsórios
      - recolhimento compulsório
      - recolhimentos compulsórios
      - compulsório
      - compulsórios
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Parte do dinheiro depositado nos bancos que eles são obrigados a deixar guardada no Banco Central, em vez de emprestar."
    definicao_tecnica: "Parcela das captações das instituições financeiras recolhida obrigatoriamente ao Banco Central; limita a multiplicação da moeda pelo crédito e funciona também como colchão de liquidez em situações de estresse."
    analogias:
      - texto: "É como uma reserva obrigatória que o síndico manda guardar do caixa do condomínio: esse dinheiro não pode ser gasto no dia a dia."
        limite: "O Banco Central pode liberar parte dessa reserva em crises, e o recolhimento pode ser remunerado; não é um dinheiro perdido pelo banco."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Perguntas frequentes: Política Monetária"
      url: "https://www.bcb.gov.br/acessoinformacao/perguntasfrequentes-respostas/faq_politicamonetariaBC"

  - id: redesconto
    termo: redesconto
    variantes:
      - operação de redesconto
      - operações de redesconto
      - redesconto do Banco Central
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Empréstimo que o Banco Central faz a um banco que precisa de dinheiro com urgência, contra garantias."
    definicao_tecnica: "Conjunto de operações de assistência financeira de liquidez em que o Banco Central, como emprestador de última instância, fornece recursos às instituições financeiras, em geral por compra de ativos com compromisso de revenda ou empréstimo contra garantias."
    analogias:
      - texto: "É como o pronto-socorro dos bancos: o Banco Central socorre a instituição que ficou sem dinheiro em caixa no curto prazo, mas exige garantias."
        limite: "O socorro é para falta momentânea de dinheiro, não para salvar banco quebrado, e o acesso fica a critério do Banco Central."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Perguntas frequentes: Política Monetária"
      url: "https://www.bcb.gov.br/acessoinformacao/perguntasfrequentes-respostas/faq_politicamonetariaBC"

  - id: mecanismo_de_transmissao
    termo: mecanismo de transmissão
    variantes:
      - mecanismos de transmissão
      - canais de transmissão
      - canal de transmissão
      - transmissão da política monetária
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Caminhos pelos quais uma mudança nos juros chega até os preços: pelo crédito, pelo consumo e investimento, pelo câmbio e pelo preço dos bens."
    definicao_tecnica: "Canais pelos quais a política monetária afeta a demanda e a inflação: custo do crédito e volume de empréstimos, decisões de consumo e investimento, taxa de câmbio e preços de ativos; operam com defasagens longas, variáveis e incertas."
    analogias:
      - texto: "É como os canos que levam a água da caixa até as torneiras da casa: a decisão sobre os juros é tomada num ponto e demora para chegar a todos os cômodos, por caminhos diferentes."
        limite: "Na economia os canos mudam de largura com o tempo e alguns podem entupir; a mesma decisão pode ter efeito diferente em momentos diferentes."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Perguntas frequentes: Política Monetária"
      url: "https://www.bcb.gov.br/acessoinformacao/perguntasfrequentes-respostas/faq_politicamonetariaBC"

  - id: defasagem_da_politica_monetaria
    termo: defasagens da política monetária
    variantes:
      - defasagem da política monetária
      - defasagens longas, variáveis e incertas
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "O tempo que uma mudança nos juros leva para fazer efeito sobre a economia e os preços."
    definicao_tecnica: "Intervalo entre a decisão de política monetária e seus efeitos sobre atividade e inflação; é longo, variável e incerto, o que obriga o banco central a decidir olhando para as projeções e não para a inflação corrente."
    analogias:
      - texto: "É como ajustar o chuveiro a gás: a água leva um tempo para esquentar ou esfriar depois que se mexe no registro, e quem gira demais acaba se queimando."
        limite: "No chuveiro o atraso é sempre parecido; na economia ele muda de uma vez para outra e não se sabe com precisão."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Relatório de Inflação, Princípios de Condução da Política Monetária no Brasil"
      url: "https://www.bcb.gov.br/content/ri/relatorioinflacao/202012/ri202012p.pdf"

  - id: horizonte_relevante
    termo: horizonte relevante
    variantes:
      - horizonte relevante de política monetária
      - horizonte relevante para a política monetária
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Período à frente que o Banco Central usa como alvo para trazer a inflação de volta à meta, levando em conta o tempo que os juros demoram para agir."
    definicao_tecnica: "Prazo de projeção sobre o qual o Copom avalia a convergência da inflação para a meta, compatível com as defasagens da política monetária; o horizonte apropriado depende da natureza e da persistência dos choques."
    analogias:
      - texto: "É como mirar um pouco à frente de um alvo em movimento: como os juros demoram a agir, o Banco Central mira na inflação de alguns trimestres adiante, não na de hoje."
        limite: "O horizonte não é um prazo garantido de chegada à meta; é a referência para a decisão e pode ser revisto conforme os choques."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Relatório de Inflação, Princípios de Condução da Política Monetária no Brasil"
      url: "https://www.bcb.gov.br/content/ri/relatorioinflacao/202012/ri202012p.pdf"

  - id: cenario_de_referencia
    termo: cenário de referência
    variantes:
      - cenário básico
      - cenário-base
      - cenário central
      - cenário base
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Conjunto de hipóteses principais que o Banco Central usa para projetar a inflação, como o caminho esperado para os juros e o câmbio."
    definicao_tecnica: "Cenário central do Copom para as projeções de inflação, construído com modelos e julgamento a partir de condicionantes (trajetória de juros da pesquisa Focus, câmbio, preços de commodities e outras hipóteses); cenários alternativos exploram riscos em torno dele."
    analogias:
      - texto: "É como a previsão do tempo mais provável para a semana: serve de base para planejar, mas vem acompanhada de outras possibilidades."
        limite: "Os condicionantes do cenário não são previsões do Banco Central sobre juros e câmbio; são hipóteses de trabalho."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Relatório de Inflação, boxe Cenários alternativos de projeção de inflação"
      url: "https://www.bcb.gov.br/content/ri/relatorioinflacao/202012/ri202012b9p.pdf"

  - id: balanco_de_riscos
    termo: balanço de riscos
    variantes:
      - balanço de riscos para a inflação
      - assimetria altista
      - assimetria baixista
      - riscos de alta
      - riscos de baixa
      - fatores de risco em ambas as direções
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Avaliação do Banco Central sobre o que pode fazer a inflação ficar acima ou abaixo do que ele projeta, e qual desses lados pesa mais."
    definicao_tecnica: "Avaliação do Copom sobre os fatores que podem levar a inflação para cima ou para baixo da projeção do cenário de referência; é simétrico quando os riscos se equilibram e assimétrico (altista ou baixista) quando um lado predomina."
    analogias:
      - texto: "É como uma balança com os motivos para a inflação subir de um lado e os motivos para cair do outro: o Banco Central diz para que lado ela pende."
        limite: "Os pesos são julgamentos do comitê, não medidas exatas, e o balanço pode mudar de uma reunião para outra."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Relatório de Inflação"
      url: "https://www.bcb.gov.br/content/ri/relatorioinflacao/202012/ri202012p.pdf"

  - id: hawkish
    termo: hawkish
    variantes:
      - postura hawkish
      - tom hawkish
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Postura mais dura de um banco central, disposto a manter ou subir os juros para controlar a inflação."
    definicao_tecnica: "Viés de comunicação ou decisão de autoridade monetária que prioriza o controle da inflação, inclinado a juros mais altos ou por mais tempo."
    analogias:
      - texto: "Do inglês para falcão: um banco central hawkish é vigilante e firme contra a inflação, mesmo que isso custe crescimento."
        limite: "É um rótulo do mercado para o tom da comunicação, não uma categoria oficial, e a mesma autoridade pode mudar de tom."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Hawkish"
      url: "https://borainvestir.b3.com.br/glossario/hawkish/"

  - id: dovish
    termo: dovish
    variantes:
      - postura dovish
      - tom dovish
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Postura mais branda de um banco central, inclinada a juros mais baixos para estimular a economia."
    definicao_tecnica: "Viés de comunicação ou decisão de autoridade monetária que dá mais peso ao crescimento e ao emprego, aceitando juros mais baixos mesmo com alguma pressão inflacionária no curto prazo."
    analogias:
      - texto: "Do inglês para pomba: um banco central dovish é mais suave e tende a afrouxar os juros."
        limite: "É um rótulo do mercado para o tom da comunicação, não uma categoria oficial; dovish não significa descuidar da meta de inflação."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Dovish"
      url: "https://borainvestir.b3.com.br/glossario/dovish/"

  - id: ponto_base
    termo: ponto-base
    variantes:
      - pontos-base
      - ponto base
      - pontos base
      - bps
      - bp
      - basis point
      - basis points
    categoria: juros
    nivel_minimo: intermediario
    definicao_simples: "Unidade bem pequena usada para descrever variações de taxas e margens; é uma pequena fração de um ponto de porcentagem."
    definicao_tecnica: "Convenção de mercado em que um ponto-base corresponde a um centésimo de ponto percentual; usada para expressar pequenas variações de rendimentos, spreads e margens."
    analogias:
      - texto: "É como medir em centavos em vez de reais: o ponto-base está para o ponto de porcentagem assim como o centavo está para o real."
        limite: "Ponto-base mede diferença entre taxas, não dinheiro; uma variação em pontos-base não diz quanto isso representa em reais sem saber o valor sobre o qual a taxa incide."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: ponto_percentual
    termo: ponto percentual
    variantes:
      - pontos percentuais
      - p.p.
    categoria: juros
    nivel_minimo: intermediario
    definicao_simples: "Diferença simples entre duas porcentagens; quando uma taxa passa de um valor para outro, a distância entre eles é medida em pontos percentuais."
    definicao_tecnica: "Unidade que expressa a diferença aritmética entre duas taxas percentuais, distinta da variação percentual relativa entre elas."
    analogias:
      - texto: "É como medir a diferença de altura entre dois degraus pela distância entre eles, e não pelo quanto um é maior que o outro em proporção."
        limite: "A analogia só ajuda a separar diferença simples de variação proporcional; ela não explica como calcular a variação percentual."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário (verbete Ponto-base)"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: spread_bancario
    termo: spread bancário
    variantes:
      - spread
      - spreads
      - spread médio
    categoria: juros
    nivel_minimo: intermediario
    definicao_simples: "Diferença entre os juros que o banco cobra de quem pega empréstimo e os juros que ele paga para conseguir o dinheiro."
    definicao_tecnica: "Diferença entre a taxa de aplicação e a taxa de captação de uma instituição financeira, que remunera custos, risco de crédito, tributos e margem; por extensão, diferença entre taxas ou entre preços de compra e venda de um ativo."
    analogias:
      - texto: "É como a margem de um comerciante: compra o dinheiro mais barato de quem deposita e vende mais caro para quem pega emprestado."
        limite: "Boa parte dessa diferença cobre calotes, impostos e custos, então spread alto não é sinônimo de lucro alto."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: taxa_referencial
    termo: Taxa Referencial
    variantes:
      - TR
    categoria: juros
    nivel_minimo: intermediario
    definicao_simples: "Taxa calculada pelo Banco Central que entra na conta do rendimento da poupança e de alguns financiamentos imobiliários."
    definicao_tecnica: "Taxa calculada pelo Banco Central a partir de taxas de títulos prefixados, usada na remuneração das cadernetas de poupança e na correção de contratos do Sistema Financeiro da Habitação."
    analogias: []
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Taxa Referencial (TR)"
      url: "https://borainvestir.b3.com.br/glossario/taxa-referencial-tr/"

  - id: tlp
    termo: TLP
    variantes:
      - Taxa de Longo Prazo
      - TJLP
      - Taxa de Juros de Longo Prazo
    categoria: juros
    nivel_minimo: avancado
    definicao_simples: "Taxa que serve de base para os juros dos financiamentos do banco público de desenvolvimento a empresas."
    definicao_tecnica: "Taxa de referência dos financiamentos do BNDES: a TLP combina a variação do IPCA com o juro real de títulos públicos indexados à inflação; substituiu a TJLP, fixada pelo Conselho Monetário Nacional, nos contratos novos."
    analogias: []
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: TLP"
      url: "https://borainvestir.b3.com.br/glossario/tlp/"

  # ------------------------------------------------------------- inflacao
  - id: inflacao
    termo: inflação
    variantes:
      - inflações
      - inflação ao consumidor
      - alta dos preços
    categoria: inflacao
    nivel_minimo: iniciante
    definicao_simples: "Aumento generalizado dos preços de produtos e serviços, que faz o dinheiro comprar menos."
    definicao_tecnica: "Aumento generalizado e contínuo dos preços de bens e serviços, que reduz o poder de compra da moeda; é medida por índices de preços, e no Brasil a referência para a política monetária é o IPCA."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, O que é inflação"
      url: "https://www.bcb.gov.br/controleinflacao/oqueinflacao"

  - id: deflacao
    termo: deflação
    variantes:
      - deflações
      - queda generalizada de preços
    categoria: inflacao
    nivel_minimo: iniciante
    definicao_simples: "Queda contínua e generalizada dos preços na economia."
    definicao_tecnica: "Redução persistente do nível geral de preços; pode levar famílias e empresas a adiar consumo e investimento, deprimindo a atividade."
    analogias: []
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Deflação"
      url: "https://borainvestir.b3.com.br/glossario/deflacao/"

  - id: poder_de_compra
    termo: poder de compra
    variantes:
      - poder aquisitivo
    categoria: inflacao
    nivel_minimo: iniciante
    definicao_simples: "Quantidade de produtos e serviços que uma quantia de dinheiro consegue comprar."
    definicao_tecnica: "Valor da moeda medido pela quantidade de bens e serviços que uma unidade monetária pode adquirir; reduz-se quando há inflação."
    analogias: []
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Poder de compra"
      url: "https://borainvestir.b3.com.br/glossario/poder-de-compra/"

  - id: ipca
    termo: IPCA
    variantes:
      - Índice Nacional de Preços ao Consumidor Amplo
      - Índice de Preços ao Consumidor Amplo
      - inflação oficial
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Principal medida da inflação no Brasil, que acompanha a variação de preços de uma cesta de produtos e serviços comprados pelas famílias."
    definicao_tecnica: "Índice de preços ao consumidor calculado mensalmente pelo IBGE para uma cesta representativa do consumo das famílias em diversas regiões do país; é o índice de referência do regime de metas para a inflação e indexador de títulos públicos."
    analogias:
      - texto: "É como o preço de um carrinho de supermercado padrão, cheio do que uma família típica compra no mês, conferido todo mês para ver quanto ficou mais caro."
        limite: "A cesta do índice inclui serviços, transporte, moradia e outros gastos além do supermercado, e cada família tem uma cesta própria; a inflação sentida pode ser diferente da medida."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Índices de preços"
      url: "https://www.bcb.gov.br/controleinflacao/indicepreco"

  - id: ipca_15
    termo: IPCA-15
    variantes:
      - prévia do IPCA
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Medida da inflação calculada do mesmo jeito que a principal, mas com a coleta de preços adiantada, funcionando como uma prévia."
    definicao_tecnica: "Índice calculado pelo IBGE com a metodologia do IPCA, mas com período de coleta que começa no mês anterior e termina na metade do mês de referência; funciona como prévia do IPCA."
    analogias:
      - texto: "É como espiar o boletim antes do fim do bimestre: dá uma boa ideia da nota final, mas não é a nota oficial."
        limite: "O resultado pode diferir do índice cheio do mês, porque o período e a abrangência da coleta não são idênticos."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: inpc
    termo: INPC
    variantes:
      - Índice Nacional de Preços ao Consumidor
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Medida de inflação voltada para famílias de renda mais baixa, muito usada em reajustes de salários."
    definicao_tecnica: "Índice de preços ao consumidor calculado pelo IBGE para famílias com rendimento mais baixo que o da cesta do IPCA; usado como parâmetro de reajuste em negociações salariais e benefícios."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: igp_m
    termo: IGP-M
    variantes:
      - Índice Geral de Preços do Mercado
      - IGP-DI
      - Índice Geral de Preços - Disponibilidade Interna
      - IGPs
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Medida de inflação calculada pela FGV que mistura preços no atacado, ao consumidor e da construção, muito usada para reajustar aluguéis."
    definicao_tecnica: "Índices gerais de preços calculados pela FGV como média ponderada de preços ao produtor (com o maior peso), ao consumidor e do custo da construção; o IGP-M e o IGP-DI diferem no período de coleta e são usados em correção de contratos."
    analogias:
      - texto: "Enquanto o índice oficial olha o carrinho de compras da família, o IGP-M olha também o preço da matéria-prima na porta da fábrica."
        limite: "Por pesar muito os preços no atacado, o IGP-M reage mais a câmbio e commodities e pode se afastar bastante da inflação ao consumidor."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: ipa
    termo: IPA
    variantes:
      - Índice de Preços ao Produtor Amplo
      - Índice de Preços ao Produtor
      - Índice de Preços no Atacado
      - preços ao produtor
      - preços aos produtores
    categoria: inflacao
    nivel_minimo: avancado
    definicao_simples: "Medida da variação de preços cobrados por quem produz, antes de os produtos chegarem às lojas."
    definicao_tecnica: "Índice calculado pela FGV que mede a variação de preços de produtos vendidos por produtores domésticos; componente de maior peso dos IGPs e indicador antecedente de pressões de custo."
    analogias:
      - texto: "É como olhar o preço na porta da fábrica ou da fazenda: se ele sobe, parte dessa alta pode chegar depois às prateleiras."
        limite: "O repasse ao consumidor não é automático nem integral; depende da demanda, das margens e da concorrência."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: indice_de_precos
    termo: índice de preços
    variantes:
      - índices de preços
      - índice de inflação
      - índices de inflação
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Número que resume a variação média dos preços de um conjunto de produtos e serviços ao longo do tempo."
    definicao_tecnica: "Indicador que agrega os preços de uma cesta de bens e serviços; sua variação mede a variação média dos preços da cesta. Há índices ao consumidor, ao produtor e de custos, com cestas e propósitos diferentes."
    analogias:
      - texto: "É como a nota média de uma turma: resume em um número o desempenho de muitos alunos, mesmo que alguns tenham ido muito melhor ou pior."
        limite: "Cada índice usa uma cesta e pesos próprios; dois índices podem mostrar variações diferentes no mesmo período sem que nenhum esteja errado."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Índices de preços"
      url: "https://www.bcb.gov.br/controleinflacao/indicepreco"

  - id: meta_para_a_inflacao
    termo: meta para a inflação
    variantes:
      - meta de inflação
      - metas para a inflação
      - centro da meta
      - meta contínua
      - convergência da inflação à meta
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Alvo de inflação definido pelo governo que o Banco Central tem a missão de perseguir."
    definicao_tecnica: "Valor de referência para a inflação medida pelo IPCA, fixado pelo Conselho Monetário Nacional; o Banco Central conduz a política monetária para alcançá-lo. A meta é anunciada publicamente e funciona como âncora para as expectativas."
    analogias:
      - texto: "É como o alvo no tiro ao alvo: o Banco Central mira no centro, e há uma faixa ao redor em que o tiro ainda conta como acerto."
        limite: "O Banco Central não controla a inflação diretamente; ele ajusta os juros, e choques fora do seu controle podem desviar o tiro por um tempo."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Metas para a inflação"
      url: "https://www.bcb.gov.br/controleinflacao/metainflacao"

  - id: regime_de_metas_para_a_inflacao
    termo: regime de metas para a inflação
    variantes:
      - sistema de metas para a inflação
      - regime de metas
      - sistema de metas
      - metas de inflação
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Sistema em que se anuncia um alvo para a inflação e o Banco Central age para mantê-la perto desse alvo, explicando publicamente quando não consegue."
    definicao_tecnica: "Arcabouço de política monetária em que o banco central atua para que a inflação efetiva fique em linha com uma meta pré-estabelecida e anunciada; envolve conhecimento público da meta, autonomia do banco central, comunicação transparente e mecanismos de prestação de contas, como carta aberta em caso de descumprimento."
    analogias:
      - texto: "É como um contrato público com o alvo escrito: todos sabem onde o Banco Central precisa chegar e ele tem de explicar se errar."
        limite: "O regime é flexível: o prazo para voltar à meta depende dos choques, então ficar fora do alvo por um tempo não significa que o sistema falhou."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Perguntas frequentes: Política Monetária"
      url: "https://www.bcb.gov.br/acessoinformacao/perguntasfrequentes-respostas/faq_politicamonetariaBC"

  - id: intervalo_de_tolerancia
    termo: intervalo de tolerância
    variantes:
      - intervalo de tolerância da meta
      - teto da meta
      - piso da meta
      - limite superior do intervalo de tolerância
      - limite inferior do intervalo de tolerância
      - banda da meta
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Faixa ao redor do alvo de inflação dentro da qual se considera que o alvo foi cumprido."
    definicao_tecnica: "Faixa definida pelo Conselho Monetário Nacional em torno da meta para a inflação que serve de referência para caracterizar seu cumprimento; inflação fora do intervalo por um período prolongado obriga o Banco Central a justificar publicamente o descumprimento."
    analogias:
      - texto: "É como a margem de erro aceita numa receita: um pouco a mais ou a menos de sal ainda está dentro do aceitável, mas passar do limite estraga o prato."
        limite: "Ficar dentro do intervalo não significa que o Banco Central esteja satisfeito; o objetivo continua sendo o centro da meta."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Metas para a inflação"
      url: "https://www.bcb.gov.br/controleinflacao/metainflacao"

  - id: expectativas_de_inflacao
    termo: expectativas de inflação
    variantes:
      - expectativa de inflação
      - inflação esperada
      - expectativas inflacionárias
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "O que pessoas, empresas e analistas acham que vai acontecer com os preços no futuro."
    definicao_tecnica: "Projeções dos agentes econômicos para a inflação futura em diferentes horizontes, medidas por pesquisas (como a Focus) e por preços de ativos; influenciam a formação de preços e salários e são uma das causas da inflação."
    analogias:
      - texto: "Se todo mundo acha que o aluguel vai subir muito no ano que vem, donos de imóveis já pedem reajustes maiores hoje: a expectativa ajuda a fazer o preço subir."
        limite: "Expectativas são opiniões que podem errar; nem toda alta esperada se confirma, e o Banco Central age justamente para influenciá-las."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, O que é inflação"
      url: "https://www.bcb.gov.br/controleinflacao/oqueinflacao"

  - id: ancoragem_das_expectativas
    termo: ancoragem das expectativas
    variantes:
      - expectativas ancoradas
      - expectativas desancoradas
      - desancoragem das expectativas
      - desancoragem
      - reancoragem das expectativas
      - reancoragem
      - âncora para as expectativas
    categoria: inflacao
    nivel_minimo: avancado
    definicao_simples: "Situação em que as pessoas acreditam que a inflação futura ficará perto do alvo oficial; quando deixam de acreditar, diz-se que as expectativas se soltaram desse alvo."
    definicao_tecnica: "Grau em que as expectativas de inflação dos agentes permanecem próximas da meta mesmo diante de choques; a meta funciona como âncora. Expectativas desancoradas elevam o custo de trazer a inflação de volta à meta e exigem política monetária mais restritiva por mais tempo."
    analogias:
      - texto: "É como um barco ancorado: as ondas (choques) balançam, mas ele volta para perto do mesmo ponto; sem âncora, ele vai sendo levado pela correnteza."
        limite: "A âncora aqui é a confiança das pessoas na meta e no Banco Central, que se constrói e se perde aos poucos; não há um mecanismo físico que segure as expectativas."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Metas para a inflação"
      url: "https://www.bcb.gov.br/controleinflacao/metainflacao"

  - id: pesquisa_focus
    termo: pesquisa Focus
    variantes:
      - Boletim Focus
      - Relatório Focus
      - Focus
      - Relatório de Mercado
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Levantamento semanal do Banco Central com as previsões de economistas de mercado para inflação, juros, câmbio e crescimento."
    definicao_tecnica: "Pesquisa do Banco Central que reúne as projeções de instituições do mercado para índices de preços, atividade, câmbio, taxa Selic e outras variáveis; é fonte das expectativas de mercado e dos condicionantes do cenário de referência do Copom."
    analogias:
      - texto: "É como uma enquete com especialistas antes de um jogo: mostra o placar que a maioria espera, não o resultado."
        limite: "A pesquisa resume opiniões do mercado, não do Banco Central, e as projeções mudam a cada semana."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Focus: Relatório de Mercado"
      url: "https://www.bcb.gov.br/publicacoes/focus"

  - id: nucleo_de_inflacao
    termo: núcleo de inflação
    variantes:
      - núcleos de inflação
      - medidas subjacentes
      - medida subjacente
      - inflação subjacente
      - média dos núcleos
    categoria: inflacao
    nivel_minimo: avancado
    definicao_simples: "Medida da inflação que tira ou suaviza os preços que variam muito por motivos passageiros, para mostrar a tendência dos preços."
    definicao_tecnica: "Índice derivado do índice principal que busca captar o componente persistente da inflação, excluindo ou reponderando itens voláteis ou sazonais (por exclusão, médias aparadas, dupla ponderação e outros métodos)."
    analogias:
      - texto: "É como tirar a média das notas de um aluno sem contar a prova em que ele estava doente: mostra melhor o desempenho de sempre."
        limite: "Os itens retirados também fazem parte do custo de vida; o núcleo indica tendência, mas não substitui a inflação cheia que as famílias sentem."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: precos_administrados
    termo: preços administrados
    variantes:
      - preço administrado
      - preços monitorados
      - IPCA administrados
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Preços definidos ou influenciados pelo governo ou por agências reguladoras, como tarifas de energia, de transporte público e planos de saúde."
    definicao_tecnica: "Componentes do IPCA sob influência potencial ou efetiva de órgão público ou agência reguladora; são menos sensíveis às condições de oferta e demanda e muitas vezes reajustados com base na inflação passada."
    analogias:
      - texto: "São como preços tabelados por contrato: não sobem nem descem com a procura do dia a dia, mas em datas e regras definidas."
        limite: "Nem todo preço administrado é fixado diretamente pelo governo, e alguns seguem parcialmente o mercado."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Nota Técnica: Núcleos de inflação e outras séries analíticas derivadas do IPCA"
      url: "https://www.bcb.gov.br/content/publicacoes/notastecnicas/NT_57_202512.pdf"

  - id: precos_livres
    termo: preços livres
    variantes:
      - preço livre
      - IPCA livres
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Preços que variam conforme a procura e a oferta do mercado, sem regra do governo, como alimentos, roupas e muitos serviços."
    definicao_tecnica: "Componentes do IPCA não classificados como administrados, com preços mais sensíveis às condições usuais de oferta e demanda; dividem-se em alimentação no domicílio, serviços e bens industriais."
    analogias:
      - texto: "São como os preços de uma feira: mudam conforme a procura, a safra e a concorrência."
        limite: "A divisão entre livres e administrados é analítica e não estrita; alguns itens ficam numa zona intermediária."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Nota Técnica: Núcleos de inflação e outras séries analíticas derivadas do IPCA"
      url: "https://www.bcb.gov.br/content/publicacoes/notastecnicas/NT_57_202512.pdf"

  - id: inflacao_de_servicos
    termo: inflação de serviços
    variantes:
      - serviços subjacente
      - preços de serviços
    categoria: inflacao
    nivel_minimo: intermediario
    definicao_simples: "Alta de preços de serviços, como aluguel, manutenção, cabeleireiro e serviços médicos."
    definicao_tecnica: "Variação dos preços do segmento de serviços dos preços livres do IPCA (produtos intangíveis); tende a ser mais persistente e mais ligada ao mercado de trabalho e ao hiato do produto."
    analogias:
      - texto: "Serviços dependem muito de trabalho de pessoas; quando os salários sobem, o preço do corte de cabelo tende a acompanhar, e costuma demorar a cair."
        limite: "A ligação com salários é uma tendência, não uma regra; aluguéis e outros serviços seguem também contratos e índices próprios."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Nota Técnica: Núcleos de inflação e outras séries analíticas derivadas do IPCA"
      url: "https://www.bcb.gov.br/content/publicacoes/notastecnicas/NT_57_202512.pdf"

  - id: bens_industriais
    termo: bens industriais
    variantes:
      - bens industrializados
    categoria: inflacao
    nivel_minimo: avancado
    definicao_simples: "Grupo de produtos físicos fabricados, como roupas, eletrodomésticos e carros, acompanhado à parte nas medidas de inflação."
    definicao_tecnica: "Segmento dos preços livres do IPCA que abrange produtos tangíveis não classificados em alimentação no domicílio; costuma ser mais sensível ao câmbio e a preços internacionais."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Nota Técnica: Núcleos de inflação e outras séries analíticas derivadas do IPCA"
      url: "https://www.bcb.gov.br/content/publicacoes/notastecnicas/NT_57_202512.pdf"

  - id: indice_de_difusao
    termo: índice de difusão
    variantes:
      - difusão da inflação
    categoria: inflacao
    nivel_minimo: avancado
    definicao_simples: "Medida que mostra que parte dos produtos e serviços acompanhados ficou mais cara no período, indicando se a alta de preços está espalhada ou concentrada."
    definicao_tecnica: "Proporção dos subitens do IPCA com variação positiva de preços no período; indica o quanto a inflação está disseminada."
    analogias:
      - texto: "É como contar quantos alunos da turma tiveram febre, e não só a temperatura média: mostra se o problema é de poucos ou de quase todos."
        limite: "A difusão não diz o tamanho das altas; muitos aumentos pequenos podem ter difusão alta com inflação baixa."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Nota Técnica: Núcleos de inflação e outras séries analíticas derivadas do IPCA"
      url: "https://www.bcb.gov.br/content/publicacoes/notastecnicas/NT_57_202512.pdf"

  - id: choque_de_oferta
    termo: choque de oferta
    variantes:
      - choques de oferta
      - choque de custos
    categoria: inflacao
    nivel_minimo: avancado
    definicao_simples: "Evento inesperado que reduz ou encarece a produção de algo, como seca, alta do petróleo ou falta de peças, e faz o preço subir."
    definicao_tecnica: "Perturbação do lado da oferta (clima, preços internacionais de commodities, escassez de insumos) que altera preços relativos e pode elevar a inflação sem aumento de demanda; seus efeitos diretos tendem a ser temporários."
    analogias:
      - texto: "É como uma geada que destrói parte da safra de café: há menos café para vender e o preço sobe, mesmo que ninguém esteja querendo comprar mais."
        limite: "Nem todo choque de oferta sobe preços de forma duradoura; o efeito direto costuma passar, e o risco maior está na propagação para outros preços."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Relatório de Inflação, boxe sobre choques de oferta e consumo das famílias"
      url: "https://www.bcb.gov.br/content/ri/relatorioinflacao/202203/ri202203b2p.pdf"

  - id: efeitos_de_segunda_ordem
    termo: efeitos de segunda ordem
    variantes:
      - efeitos secundários
      - efeito secundário
      - efeitos primários
      - efeito de segunda ordem
    categoria: inflacao
    nivel_minimo: avancado
    definicao_simples: "Quando a alta de preço de um item, causada por um evento passageiro, começa a se espalhar para outros preços e para os salários."
    definicao_tecnica: "Propagação de um choque que altera preços relativos para preços da economia não diretamente afetados por ele, via indexação, salários e expectativas; os efeitos primários são o impacto direto do choque. A política monetária, com expectativas ancoradas, deve combater apenas os efeitos secundários."
    analogias:
      - texto: "É como um incêndio numa casa (efeito primário): o perigo maior é o fogo passar para as casas vizinhas (efeitos de segunda ordem)."
        limite: "Com expectativas de inflação ancoradas, a propagação costuma ser contida; se as pessoas passarem a esperar mais inflação, ela pode se espalhar mais. Na economia o espalhamento acontece por reajustes de preços e salários, não por contato físico."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Ata da 215ª reunião do Copom"
      url: "https://www.bcb.gov.br/content/copom/atascopom/Copom215-not20180620215.pdf"

  - id: precos_relativos
    termo: preços relativos
    variantes:
      - preço relativo
      - ajuste de preços relativos
    categoria: inflacao
    nivel_minimo: avancado
    definicao_simples: "Preço de um produto comparado com o de outros; quando um sobe muito mais que os demais, mudam os preços relativos."
    definicao_tecnica: "Relação entre os preços de diferentes bens e serviços; um choque pode alterá-los (ajuste de preços relativos) sem significar aumento generalizado e persistente de preços."
    analogias:
      - texto: "Se o tomate dobra de preço e o resto fica igual, o tomate ficou caro em relação ao resto: isso é mudança de preço relativo, não necessariamente inflação."
        limite: "Se a alta de um item começa a puxar todos os outros, o ajuste relativo vira inflação generalizada."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Ata da 215ª reunião do Copom"
      url: "https://www.bcb.gov.br/content/copom/atascopom/Copom215-not20180620215.pdf"

  - id: ajuste_sazonal
    termo: ajuste sazonal
    variantes:
      - dessazonalizado
      - dessazonalizada
      - dessazonalizados
      - com ajuste sazonal
      - série dessazonalizada
    categoria: inflacao
    nivel_minimo: avancado
    definicao_simples: "Tratamento estatístico que tira de um número os efeitos que se repetem todo ano na mesma época, como Natal ou feriados, para comparar meses diferentes."
    definicao_tecnica: "Processo estatístico que remove os efeitos recorrentes de variações sazonais e de calendário de séries temporais econômicas, permitindo comparar períodos consecutivos."
    analogias:
      - texto: "É como comparar as vendas de uma sorveteria descontando que o verão sempre vende mais: assim dá para ver se o negócio melhorou de fato."
        limite: "O ajuste é uma estimativa e é revisado quando chegam dados novos; o número ajustado não é o que de fato aconteceu no mês."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: carregamento_estatistico
    termo: carregamento estatístico
    variantes:
      - carry over
      - efeito carregamento
    categoria: inflacao
    nivel_minimo: avancado
    definicao_simples: "Parte do resultado de um ano que já está garantida pelo que aconteceu no ano anterior, mesmo que nada mais mude."
    definicao_tecnica: "Contribuição mecânica do desempenho de uma variável até determinado período para sua variação média em períodos seguintes, mantido constante o último valor da série."
    analogias:
      - texto: "É como começar uma corrida alguns metros à frente porque terminou o último treino adiantado: parte da vantagem já vem de antes."
        limite: "O carregamento só mede o efeito herdado; o resultado final depende do que acontecer no novo período."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: bens_comercializaveis
    termo: bens comercializáveis
    variantes:
      - comercializáveis
      - não comercializáveis
      - bens não comercializáveis
    categoria: inflacao
    nivel_minimo: avancado
    definicao_simples: "Produtos que podem ser comprados ou vendidos com outros países e por isso sofrem concorrência de fora; os que não podem, como corte de cabelo, ficam mais presos às condições locais."
    definicao_tecnica: "Classificação dos preços livres do IPCA: comercializáveis são mais sujeitos às condições internacionais; não comercializáveis têm baixo potencial de exportação ou importação e ficam pouco expostos à concorrência externa."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Nota Técnica: Núcleos de inflação e outras séries analíticas derivadas do IPCA"
      url: "https://www.bcb.gov.br/content/publicacoes/notastecnicas/NT_57_202512.pdf"

  # ------------------------------------------------------------ atividade
  - id: pib
    termo: PIB
    variantes:
      - Produto Interno Bruto
    categoria: atividade
    nivel_minimo: iniciante
    definicao_simples: "Soma do valor de todos os produtos e serviços finais produzidos no país num período; mede o tamanho da economia."
    definicao_tecnica: "Valor de todos os bens e serviços finais produzidos no território econômico em determinado período, a preços de mercado; sua variação mede o crescimento da atividade econômica."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: produto_potencial
    termo: produto potencial
    variantes:
      - PIB potencial
      - crescimento potencial
    categoria: atividade
    nivel_minimo: avancado
    definicao_simples: "Quanto a economia consegue produzir usando normalmente seus trabalhadores e máquinas, sem provocar alta de preços nem queda."
    definicao_tecnica: "Nível de produto que não gera pressões inflacionárias nem desinflacionárias; é variável não observável, estimada com elevada incerteza por diferentes metodologias."
    analogias:
      - texto: "É como a velocidade em que um motor anda sem esquentar: dá para ir mais rápido por um tempo, mas o motor superaquece."
        limite: "O potencial não é observado, muda com investimento, tecnologia e população, e diferentes estimativas podem discordar bastante."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Relatório de Inflação, boxe sobre hiato do produto"
      url: "https://www.bcb.gov.br/content/ri/relatorioinflacao/202406/ri202406b10p.pdf"

  - id: hiato_do_produto
    termo: hiato do produto
    variantes:
      - hiato
      - hiato positivo
      - hiato negativo
      - ociosidade da economia
      - grau de ociosidade
    categoria: atividade
    nivel_minimo: avancado
    definicao_simples: "Diferença entre o quanto a economia está produzindo e o quanto conseguiria produzir sem pressionar os preços; se está acima, os preços tendem a subir."
    definicao_tecnica: "Diferença percentual entre o produto efetivo e o produto potencial; hiato positivo indica economia aquecida, com pressão inflacionária, e negativo indica ociosidade, com pressão desinflacionária. É estimado com elevada incerteza."
    analogias:
      - texto: "É como uma fábrica funcionando acima da capacidade normal: com horas extras e máquinas no limite, os custos sobem; com máquinas paradas, sobra espaço e os custos ficam contidos."
        limite: "Ninguém mede a capacidade da economia diretamente como a de uma fábrica; o hiato é estimado e pode ser revisto depois."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Relatório de Inflação, boxe sobre hiato do produto"
      url: "https://www.bcb.gov.br/content/ri/relatorioinflacao/202406/ri202406b10p.pdf"

  - id: ibc_br
    termo: IBC-Br
    variantes:
      - Índice de Atividade Econômica do Banco Central
    categoria: atividade
    nivel_minimo: avancado
    definicao_simples: "Indicador mensal do Banco Central que acompanha o ritmo da economia antes de sair o resultado oficial do crescimento."
    definicao_tecnica: "Indicador mensal que reúne informações da agropecuária, da indústria, dos serviços e dos impostos sobre produtos para acompanhar a atividade econômica de forma mais tempestiva que o PIB; é usado como sinalizador antecedente."
    analogias:
      - texto: "É como olhar o velocímetro a cada mês em vez de esperar o fim da viagem para saber a média: dá uma ideia rápida do ritmo."
        limite: "O IBC-Br não é o PIB mensal; a metodologia é diferente e os dois podem divergir."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: taxa_de_desemprego
    termo: taxa de desemprego
    variantes:
      - desemprego
      - taxa de desocupação
      - desocupação
    categoria: atividade
    nivel_minimo: iniciante
    definicao_simples: "Parte das pessoas que querem trabalhar e procuram emprego, mas não encontram."
    definicao_tecnica: "Proporção de pessoas desocupadas, que procuram trabalho, em relação à força de trabalho; indicador do mercado de trabalho acompanhado pela política monetária."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário (verbete Indicador econômico)"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: credito_livre
    termo: recursos livres
    variantes:
      - crédito livre
      - crédito com recursos livres
      - operações de crédito com recursos livres
    categoria: atividade
    nivel_minimo: avancado
    definicao_simples: "Empréstimos em que o banco decide para quem emprestar e combina os juros livremente com o cliente."
    definicao_tecnica: "Operações de crédito com taxas de juros livremente pactuadas entre instituições financeiras e mutuários, em que as instituições têm autonomia sobre a destinação dos recursos captados; são mais sensíveis à política monetária."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: credito_direcionado
    termo: recursos direcionados
    variantes:
      - crédito direcionado
      - créditos direcionados
      - crédito com recursos direcionados
      - operações de crédito com recursos direcionados
    categoria: atividade
    nivel_minimo: avancado
    definicao_simples: "Empréstimos com regras do governo sobre destino e juros, como financiamento imobiliário, rural e de infraestrutura."
    definicao_tecnica: "Operações de crédito regulamentadas pelo CMN ou vinculadas a recursos orçamentários, destinadas basicamente aos setores imobiliário, rural e de infraestrutura, com fontes como parcelas de depósitos à vista e da poupança e fundos públicos; respondem menos à taxa Selic."
    analogias:
      - texto: "É como dinheiro com carimbo: só pode ir para certos destinos e com juros definidos por regra, não pela negociação com o banco."
        limite: "Como os juros seguem regras próprias, mudanças na Selic chegam mais devagar a esse crédito, o que reduz a potência da política monetária."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: inadimplencia
    termo: inadimplência
    variantes:
      - inadimplente
      - inadimplentes
      - calote
    categoria: atividade
    nivel_minimo: iniciante
    definicao_simples: "Situação de quem deixou de pagar uma dívida no prazo combinado."
    definicao_tecnica: "Descumprimento de obrigação de pagamento nos termos contratados; nas estatísticas do Banco Central, mede-se pela proporção da carteira de crédito com atraso acima de um prazo de referência."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: capital_de_giro
    termo: capital de giro
    variantes:
      - crédito para capital de giro
    categoria: atividade
    nivel_minimo: intermediario
    definicao_simples: "Dinheiro que uma empresa usa para pagar as despesas do dia a dia enquanto espera receber das vendas."
    definicao_tecnica: "Recursos de curto prazo que financiam o ciclo operacional da empresa; nas estatísticas de crédito, operações destinadas ao financiamento de curto prazo das empresas."
    analogias:
      - texto: "É como o troco e o estoque que uma padaria precisa ter antes de vender o primeiro pão do dia."
        limite: "Ter capital de giro não significa ter lucro; uma empresa lucrativa pode faltar dinheiro se vender a prazo e pagar à vista."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: commodities
    termo: commodities
    variantes:
      - commodity
      - matérias-primas
      - preços das commodities
    categoria: atividade
    nivel_minimo: intermediario
    definicao_simples: "Produtos básicos produzidos em grande quantidade e quase iguais entre si, como petróleo, minério, soja e café, com preço definido no mercado mundial."
    definicao_tecnica: "Bens primários padronizados, negociados globalmente, que servem de matéria-prima (agrícolas, minerais e energéticos); seus preços internacionais afetam inflação, câmbio e contas externas."
    analogias:
      - texto: "Um quilo de soja de uma fazenda é praticamente igual ao de outra; por isso o preço é o mesmo no mundo todo, como acontece com o ouro."
        limite: "Ainda há diferenças de qualidade, frete e prazo que fazem o preço local variar em relação à referência internacional."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Commodities"
      url: "https://borainvestir.b3.com.br/glossario/commodities/"

  - id: petroleo_brent
    termo: petróleo Brent
    variantes:
      - Brent
      - barril de Brent
    categoria: atividade
    nivel_minimo: avancado
    definicao_simples: "Tipo de petróleo cujo preço serve de referência internacional, inclusive para combustíveis no Brasil."
    definicao_tecnica: "Petróleo negociado no mercado de Londres cuja cotação é referência internacional de preços do petróleo e entra nas hipóteses das projeções de inflação."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: bandeira_tarifaria
    termo: bandeira tarifária
    variantes:
      - bandeiras tarifárias
      - bandeira verde
      - bandeira amarela
      - bandeira vermelha
    categoria: atividade
    nivel_minimo: iniciante
    definicao_simples: "Sinal na conta de luz que indica se gerar energia está barato ou caro naquele mês; nas cores mais caras, a conta fica mais alta."
    definicao_tecnica: "Sistema que sinaliza aos consumidores os custos reais da geração de energia elétrica: verde indica condições favoráveis; amarela, menos favoráveis; vermelha, mais custosas, com acréscimo na tarifa."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Agência Nacional de Energia Elétrica (ANEEL), Bandeiras tarifárias"
      url: "https://www.gov.br/aneel/pt-br/assuntos/tarifas/bandeiras-tarifarias"

  - id: macroeconomia
    termo: macroeconomia
    variantes:
      - macroeconômico
      - macroeconômica
      - macroeconômicos
      - cenário macroeconômico
    categoria: atividade
    nivel_minimo: intermediario
    definicao_simples: "Parte da economia que estuda o país como um todo: produção, emprego, preços, juros e contas com o exterior."
    definicao_tecnica: "Ramo da ciência econômica dedicado ao estudo do comportamento agregado de variáveis como produção, emprego, inflação, juros e câmbio, em nível regional, nacional ou global."
    analogias:
      - texto: "É olhar a floresta inteira em vez de cada árvore: em vez de uma empresa ou família, o foco é o conjunto."
        limite: "O que vale para o conjunto nem sempre vale para cada parte; a média pode esconder situações muito diferentes."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Macroeconomia"
      url: "https://borainvestir.b3.com.br/glossario/macroeconomia/"

  - id: credito_consignado
    termo: crédito consignado
    variantes:
      - empréstimo consignado
      - consignado
    categoria: atividade
    nivel_minimo: iniciante
    definicao_simples: "Empréstimo pessoal em que as parcelas são descontadas direto do salário ou do benefício."
    definicao_tecnica: "Operação de empréstimo pessoal com desconto em folha de pagamento e sem destinação específica dos recursos; o desconto reduz o risco para o credor e, em geral, os juros."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: cheque_especial
    termo: cheque especial
    variantes:
      - limite da conta
    categoria: atividade
    nivel_minimo: iniciante
    definicao_simples: "Limite de crédito ligado à conta corrente que é usado automaticamente quando o saldo fica negativo."
    definicao_tecnica: "Operação de crédito vinculada à conta corrente com limite pré-estabelecido, utilizada sem comunicação prévia à instituição; é modalidade de curto prazo e de juros elevados."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: rotativo_do_cartao
