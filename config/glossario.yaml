    fonte:
      nome: "B3, Bora Investir, Glossário: Processo de suitability"
      url: "https://borainvestir.b3.com.br/glossario/processo-de-suitability/"

  - id: compliance
    termo: compliance
    variantes:
      - conformidade regulatória
    categoria: regulatorio
    nivel_minimo: intermediario
    definicao_simples: "Área ou prática de garantir que a empresa cumpre as leis, regras e políticas internas."
    definicao_tecnica: "Cumprimento das políticas, procedimentos e normas da regulação vigente, e estrutura interna responsável por monitorá-lo."
    analogias:
      - texto: "É como o fiscal interno que confere se tudo na empresa está dentro das regras antes que o fiscal de fora apareça."
        limite: "Ter área de compliance não garante ausência de irregularidades."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Compliance"
      url: "https://borainvestir.b3.com.br/glossario/compliance/"

  - id: indice_de_basileia
    termo: índice de Basileia
    variantes:
      - Basileia
      - Acordo de Basileia
      - requerimento de capital
    categoria: regulatorio
    nivel_minimo: avancado
    definicao_simples: "Medida que mostra se um banco tem capital próprio suficiente para cobrir os riscos dos empréstimos e investimentos que faz."
    definicao_tecnica: "Relação entre o capital regulatório de uma instituição financeira e seus ativos ponderados pelo risco, com mínimo exigido pela regulação baseada nos acordos do Comitê de Basileia."
    analogias:
      - texto: "É como o colchão de segurança de um banco: quanto mais grosso, mais perdas ele aguenta sem quebrar."
        limite: "Cumprir o mínimo não elimina o risco de problemas; o índice depende de como os riscos são medidos."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Índice de Basileia"
      url: "https://borainvestir.b3.com.br/glossario/indice-de-basileia/"

  - id: cade
    termo: Cade
    variantes:
      - Conselho Administrativo de Defesa Econômica
    categoria: regulatorio
    nivel_minimo: intermediario
    definicao_simples: "Órgão do governo que protege a concorrência e precisa aprovar certas compras e uniões entre empresas."
    definicao_tecnica: "Autarquia federal responsável por zelar pela livre concorrência, investigando e julgando infrações à ordem econômica e analisando atos de concentração, como fusões e aquisições."
    analogias:
      - texto: "É como o árbitro que impede que um time compre todos os outros e acabe com o campeonato."
        limite: "A aprovação do Cade pode vir com condições, e nem toda operação precisa passar por ele."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: CADE"
      url: "https://borainvestir.b3.com.br/glossario/conselho-administrativo-de-defesa-economica-cade/"

  - id: ifrs
    termo: IFRS
    variantes:
      - normas internacionais de contabilidade
      - International Financial Reporting Standards
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Regras internacionais de contabilidade que permitem comparar os números de empresas de países diferentes."
    definicao_tecnica: "Normas internacionais de relatório financeiro, adotadas no Brasil por meio dos pronunciamentos do CPC para as companhias abertas."
    analogias:
      - texto: "É como uma régua comum para medir empresas no mundo todo."
        limite: "As normas deixam espaço para julgamento e escolhas; números em IFRS ainda podem não ser totalmente comparáveis."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: IFRS"
      url: "https://borainvestir.b3.com.br/glossario/ifrs/"

  - id: periodo_de_silencio
    termo: período de silêncio
    variantes:
      - quiet period
    categoria: regulatorio
    nivel_minimo: avancado
    definicao_simples: "Período em que a empresa evita divulgar informações fora dos canais oficiais, como durante uma oferta de ações ou antes de divulgar resultados."
    definicao_tecnica: "Período em que a companhia e os envolvidos em uma oferta pública se abstêm de divulgar informações sobre a oferta ou o emissor fora dos documentos oficiais."
    analogias: []
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Período de silêncio"
      url: "https://borainvestir.b3.com.br/glossario/periodo-de-silencio/"

  - id: anbima
    termo: Anbima
    variantes:
      - Associação Brasileira das Entidades dos Mercados Financeiro e de Capitais
    categoria: regulatorio
    nivel_minimo: avancado
    definicao_simples: "Associação das instituições do mercado financeiro que cria regras próprias, certificações e indicadores de referência."
    definicao_tecnica: "Entidade representativa das instituições dos mercados financeiro e de capitais que exerce autorregulação, emite certificações profissionais e publica índices e preços de referência."
    analogias: []
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Anbima"
      url: "https://borainvestir.b3.com.br/glossario/anbima-associacao-brasileira-das-entidades-dos-mercados-financeiro-e-de-capitais/"

  # -------------------------------------------------------------- contabil
  - id: receita_bruta
    termo: receita bruta
    variantes:
      - receitas brutas
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Total vendido pela empresa no período, antes de tirar impostos sobre vendas, devoluções e descontos."
    definicao_tecnica: "Receita das vendas de bens e serviços antes das deduções (impostos sobre vendas, devoluções e abatimentos), primeira linha da demonstração do resultado."
    analogias:
      - texto: "É todo o dinheiro que entrou no caixa da loja pelas vendas, antes de separar o que vai para impostos e trocas."
        limite: "Receita não é lucro; ainda faltam custos e despesas."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: receita_liquida
    termo: receita líquida
    variantes:
      - receitas líquidas
      - receita operacional líquida
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Total vendido pela empresa depois de tirar impostos sobre vendas, devoluções e descontos."
    definicao_tecnica: "Receita bruta menos deduções (tributos sobre vendas, devoluções e abatimentos); base para o cálculo de margens na demonstração do resultado."
    analogias:
      - texto: "É o dinheiro das vendas que de fato fica com a loja depois de separar impostos e trocas, mas antes de pagar fornecedores e salários."
        limite: "Ainda não é lucro; custos e despesas vêm depois."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: lucro_bruto
    termo: lucro bruto
    variantes:
      - resultado bruto
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "O que sobra das vendas depois de pagar o custo direto de produzir ou comprar o que foi vendido."
    definicao_tecnica: "Receita líquida menos o custo das mercadorias e serviços vendidos."
    analogias:
      - texto: "É o que sobra da venda de um bolo depois de pagar ingredientes, antes de pagar aluguel e funcionários."
        limite: "Despesas gerais, juros e impostos sobre o lucro ainda vão ser descontados."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: lucro_liquido
    termo: lucro líquido
    variantes:
      - lucros líquidos
      - prejuízo líquido
      - resultado líquido
      - lucro líquido societário
      - lucro atribuído aos acionistas
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "O que sobra para a empresa depois de pagar todos os custos, despesas, juros e impostos do período."
    definicao_tecnica: "Resultado final do exercício após custos, despesas operacionais, resultado financeiro, tributos sobre o lucro e participações; base da distribuição de dividendos."
    analogias:
      - texto: "É o que sobra no bolso no fim do mês depois de pagar todas as contas."
        limite: "Lucro não é o mesmo que dinheiro em caixa; vendas a prazo e despesas sem saída de caixa fazem os dois diferirem."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: lucro_antes_dos_tributos
    termo: lucro antes do imposto de renda
    variantes:
      - lucro antes dos impostos
      - LAIR
      - resultado antes dos tributos sobre o lucro
      - lucro antes de IR e CS
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Resultado da empresa antes de descontar os impostos cobrados sobre o lucro."
    definicao_tecnica: "Resultado do exercício antes do imposto de renda e da contribuição social sobre o lucro, conforme a estrutura da demonstração do resultado."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: resultado_financeiro
    termo: resultado financeiro
    variantes:
      - receitas financeiras
      - despesas financeiras
      - receita financeira
      - despesa financeira
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Diferença entre o que a empresa ganha com aplicações e o que gasta com juros de dívidas."
    definicao_tecnica: "Receitas financeiras (rendimentos de aplicações, juros recebidos, variações monetárias e cambiais ativas) menos despesas financeiras (juros e encargos de dívidas, variações passivas), apresentados na demonstração do resultado."
    analogias:
      - texto: "É como o saldo entre o que a família ganha com a poupança e o que paga de juros no cartão."
        limite: "Pode incluir efeitos de câmbio e de derivativos que não são juros propriamente ditos."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Presidência da República, Lei nº 6.404 (Lei das S.A.)"
      url: "https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"

  - id: ebitda
    termo: EBITDA
    variantes:
      - LAJIDA
      - lucro antes de juros, impostos, depreciação e amortização
      - margem EBITDA
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Medida do resultado que a empresa gera com suas operações, antes de juros, impostos e do desgaste contábil de máquinas e outros bens."
    definicao_tecnica: "Medida não contábil (LAJIDA) igual ao resultado líquido acrescido dos tributos sobre o lucro, das despesas financeiras líquidas das receitas financeiras e das depreciações, amortizações e exaustões; deve ser conciliada com as demonstrações. A margem EBITDA é o EBITDA dividido pela receita líquida."
    analogias:
      - texto: "É como olhar quanto um restaurante gera com a cozinha e o salão funcionando, antes de pensar no empréstimo que pegou, nos impostos e no desgaste do fogão."
        limite: "Não é dinheiro disponível: ignora investimentos necessários, impostos e juros que a empresa terá de pagar."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comissão de Valores Mobiliários, Resolução CVM 156"
      url: "https://conteudo.cvm.gov.br/legislacao/resolucoes/resol156.html"

  - id: ebitda_ajustado
    termo: EBITDA ajustado
    variantes:
      - LAJIDA ajustado
      - EBITDA recorrente
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Versão da medida de resultado operacional em que a empresa retira efeitos que considera fora do normal, explicando o que retirou."
    definicao_tecnica: "LAJIDA com ajustes definidos pela administração (como operações descontinuadas ou itens considerados não recorrentes), divulgado junto com o cálculo sem ajustes e com a conciliação dos itens excluídos."
    analogias:
      - texto: "É como calcular o gasto normal do mês tirando uma despesa rara, como o conserto do telhado, para ver o padrão de sempre."
        limite: "O que conta como fora do normal é escolha da empresa; ajustes generosos podem fazer o resultado parecer melhor do que é."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comissão de Valores Mobiliários, Nota explicativa à Resolução CVM 156"
      url: "https://conteudo.cvm.gov.br/cvm_institucional/export/sites/cvm/legislacao/notas-explicativas/anexos/nota_resol156.pdf"

  - id: itens_nao_recorrentes
    termo: itens não recorrentes
    variantes:
      - não recorrente
      - não recorrentes
      - efeito não recorrente
      - lucro recorrente
      - lucro líquido recorrente
      - resultado recorrente
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Ganhos ou gastos que a empresa considera fora do comum e que não devem se repetir; tirá-los ajuda a ver o resultado do dia a dia."
    definicao_tecnica: "Efeitos que a administração classifica como não habituais (venda de participação, baixas, litígios); medidas recorrentes os excluem e, por serem não contábeis, exigem conciliação com as demonstrações."
    analogias:
      - texto: "É como separar a herança recebida uma única vez do salário do mês, para saber quanto se ganha normalmente."
        limite: "A classificação é feita pela própria empresa; itens chamados de não recorrentes às vezes se repetem."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comissão de Valores Mobiliários, Nota explicativa à Resolução CVM 156"
      url: "https://conteudo.cvm.gov.br/cvm_institucional/export/sites/cvm/legislacao/notas-explicativas/anexos/nota_resol156.pdf"

  - id: lucro_por_acao
    termo: lucro por ação
    variantes:
      - LPA
      - resultado por ação
      - lucro por ação básico
      - lucro por ação diluído
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Parte do lucro da empresa que corresponde a cada ação."
    definicao_tecnica: "Lucro ou prejuízo atribuível aos titulares de ações ordinárias dividido pelo número médio ponderado de ações em circulação no período, excluídas as em tesouraria; a versão diluída considera ações potenciais."
    analogias:
      - texto: "É como dividir o lucro de uma pizzaria pelo número de cotas dos sócios para saber quanto cabe a cada cota."
        limite: "O número não é o que o sócio recebe em dinheiro; só a parte distribuída chega ao bolso."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 41 (Resultado por Ação)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=72"

  - id: capex
    termo: CAPEX
    variantes:
      - investimentos em capital
      - despesas de capital
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Dinheiro que a empresa gasta para comprar, melhorar ou manter bens duradouros, como máquinas, prédios e sistemas."
    definicao_tecnica: "Investimentos em ativos de longa duração (imobilizado e intangível) para ampliar ou manter a capacidade produtiva; registrados no balanço e depreciados ou amortizados ao longo do tempo."
    analogias:
      - texto: "É como a família comprar um carro ou reformar a casa: um gasto grande que dura anos, diferente da conta de luz do mês."
        limite: "Na contabilidade o custo é espalhado ao longo da vida útil do bem, não lançado de uma vez como despesa."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: CAPEX"
      url: "https://borainvestir.b3.com.br/glossario/capex-capital-expenditure/"

  - id: opex
    termo: OPEX
    variantes:
      - despesas operacionais
      - despesa operacional
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Gastos do dia a dia para manter a empresa funcionando, como salários, aluguel e energia."
    definicao_tecnica: "Despesas contínuas necessárias à operação do negócio (pessoal, aluguel, energia, manutenção, serviços), reconhecidas no resultado do período."
    analogias:
      - texto: "É como as contas fixas do mês de uma casa: luz, água, mercado."
        limite: "A fronteira entre manter (despesa) e melhorar (investimento) pode depender de critérios contábeis."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: OPEX"
      url: "https://borainvestir.b3.com.br/glossario/opex-operational-expenditure/"

  - id: depreciacao_amortizacao
    termo: depreciação e amortização
    variantes:
      - depreciação
      - depreciações
      - amortização de intangível
      - exaustão
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Registro contábil do desgaste ou da perda de valor de bens duradouros ao longo do tempo, sem saída de dinheiro no período."
    definicao_tecnica: "Alocação sistemática do valor depreciável de ativos imobilizados (depreciação) e de intangíveis de vida útil definida (amortização) ao longo da vida útil; despesa sem efeito de caixa no período."
    analogias:
      - texto: "É como contar, todo mês, um pedaço do valor de um celular que vai ficando velho, mesmo sem gastar nada naquele mês."
        limite: "O valor registrado segue regras contábeis de vida útil, que podem não bater com o desgaste real."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 27 (Ativo Imobilizado)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=58"

  - id: amortizacao_de_divida
    termo: amortização
    variantes:
      - amortização da dívida
      - amortização do principal
      - cronograma de amortização
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Pagamento de parte do valor emprestado, que diminui o tamanho da dívida."
    definicao_tecnica: "Redução do saldo devedor de um financiamento ou título por pagamentos pontuais ou periódicos do principal, distintos do pagamento de juros."
    analogias:
      - texto: "É como cada parcela do financiamento do carro, que vai abatendo o que ainda falta pagar."
        limite: "Em contabilidade a palavra também designa a perda de valor de bens intangíveis, um sentido diferente."
        status: rascunho
    ambiguo: true
    fonte:
      nome: "B3, Bora Investir, Glossário: Amortização"
      url: "https://borainvestir.b3.com.br/glossario/amortizacao/"

  - id: agio
    termo: ágio
    variantes:
      - ágio por expectativa de rentabilidade futura
      - goodwill
      - amortização de ágio
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Valor pago a mais ao comprar uma empresa, acima do valor dos bens que dá para identificar, em troca da expectativa de lucros futuros."
    definicao_tecnica: "Ativo que representa benefícios econômicos futuros de ativos adquiridos em combinação de negócios que não são identificados e reconhecidos separadamente; não é amortizado contabilmente e é testado anualmente para redução ao valor recuperável, embora possa ter amortização fiscal."
    analogias:
      - texto: "É como pagar mais por uma padaria do que valem os fornos e o balcão, porque ela já tem clientela fiel."
        limite: "Se a clientela esperada não se confirma, esse valor a mais pode ter de ser baixado no balanço."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 15 (Combinação de Negócios)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=46"

  - id: ativo_intangivel
    termo: ativo intangível
    variantes:
      - ativos intangíveis
      - intangível
      - intangíveis
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Bem da empresa que não se pode tocar, como marcas, softwares, licenças e carteiras de clientes."
    definicao_tecnica: "Ativo não monetário identificável sem substância física, como softwares, marcas, licenças e relacionamentos com clientes, reconhecido quando controlado e gerador de benefícios futuros."
    analogias:
      - texto: "É como o nome conhecido de um restaurante: vale dinheiro, mesmo sem ser uma mesa ou uma panela."
        limite: "Nem todo valor intangível vai para o balanço; marcas criadas internamente, por exemplo, em geral não são registradas."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 04 (Ativo Intangível)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=35"

  - id: impairment
    termo: impairment
    variantes:
      - redução ao valor recuperável
      - teste de impairment
      - perda por impairment
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Baixa no valor de um bem no balanço quando se conclui que ele vale menos do que estava registrado."
    definicao_tecnica: "Reconhecimento de perda quando o valor contábil de um ativo excede seu valor recuperável (o maior entre valor justo menos custos de venda e valor em uso)."
    analogias:
      - texto: "É como reavaliar um carro batido: o valor anotado no caderno precisa cair para o que ele realmente vale."
        limite: "É uma estimativa baseada em projeções; não há venda nem saída de dinheiro no momento da baixa."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 01 (Redução ao Valor Recuperável de Ativos)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=2"

  - id: provisao
    termo: provisão
    variantes:
      - provisão para contingências
      - passivo contingente
      - passivos contingentes
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Valor que a empresa reserva no balanço para uma obrigação provável cujo valor ou data ainda não são certos, como um processo judicial."
    definicao_tecnica: "Passivo de prazo ou valor incertos reconhecido quando há obrigação presente, saída de recursos provável e estimativa confiável; passivos contingentes que não atendem a esses critérios são apenas divulgados."
    analogias:
      - texto: "É como separar dinheiro para uma multa que provavelmente vai chegar, mesmo sem saber o valor exato."
        limite: "A provisão é contábil: não significa que o dinheiro foi guardado numa conta separada."
        status: rascunho
    ambiguo: true
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 25 (Provisões, Passivos Contingentes e Ativos Contingentes)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=56"

  - id: hedge_accounting
    termo: hedge accounting
    variantes:
      - contabilidade de hedge
      - contabilização de hedge
      - hedge de fluxo de caixa
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Forma de contabilizar uma proteção financeira junto com aquilo que ela protege, para que os números não oscilem de maneira artificial."
    definicao_tecnica: "Tratamento contábil opcional que reconhece de forma simétrica os efeitos do instrumento de hedge e do item protegido (hedge de valor justo, de fluxo de caixa ou de investimento no exterior), sujeito a documentação e testes de eficácia."
    analogias:
      - texto: "É como lançar no mesmo dia, no mesmo caderno, o prejuízo do produto e o ganho do seguro que o cobre, para mostrar o efeito líquido."
        limite: "Só vale com documentação e critérios específicos; sem isso, os efeitos aparecem em momentos diferentes no resultado."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 48 (Instrumentos Financeiros)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=106"

  - id: valor_justo
    termo: valor justo
    variantes:
      - valores justos
      - fair value
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Preço pelo qual um bem seria vendido, ou uma dívida transferida, numa negociação normal entre interessados."
    definicao_tecnica: "Preço que seria recebido pela venda de um ativo ou pago pela transferência de um passivo em transação não forçada entre participantes do mercado na data de mensuração."
    analogias:
      - texto: "É o preço que um comprador e um vendedor bem informados, sem pressa, combinariam hoje."
        limite: "Quando não há mercado ativo, o valor justo é estimado por modelos e pode variar com as premissas."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 46 (Mensuração do Valor Justo)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=78"

  - id: equivalencia_patrimonial
    termo: equivalência patrimonial
    variantes:
      - método de equivalência patrimonial
      - resultado de equivalência patrimonial
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Forma de a empresa registrar, no próprio resultado, a sua parte no lucro ou prejuízo de outra empresa em que tem participação relevante."
    definicao_tecnica: "Método contábil em que o investimento em coligada, controlada ou empreendimento controlado em conjunto é ajustado pela participação do investidor no resultado e no patrimônio da investida."
    analogias:
      - texto: "É como somar ao seu resultado a sua fatia do lucro de um negócio de que você é sócio, mesmo sem ter recebido o dinheiro."
        limite: "O valor reconhecido não é caixa recebido; o dinheiro só entra quando a investida distribui lucros."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 18 (Investimento em Coligada e em Empreendimento Controlado em Conjunto)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=49"

  - id: demonstracoes_consolidadas
    termo: demonstrações consolidadas
    variantes:
      - balanço consolidado
      - resultado consolidado
      - demonstrações financeiras consolidadas
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Números de um grupo de empresas apresentados como se fossem de uma só, somando a empresa principal e as que ela controla."
    definicao_tecnica: "Demonstrações do grupo econômico em que ativos, passivos, receitas, despesas e fluxos de caixa da controladora e de suas controladas são apresentados como os de uma única entidade, eliminadas as transações internas."
    analogias:
      - texto: "É como o orçamento da família inteira, somando a conta de todos e tirando as transferências entre irmãos."
        limite: "O consolidado esconde a situação de cada empresa do grupo; uma pode estar bem e outra mal."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 36 (Demonstrações Consolidadas)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=67"

  - id: patrimonio_liquido
    termo: patrimônio líquido
    variantes:
      - PL
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "O que sobraria para os sócios se a empresa vendesse todos os seus bens e pagasse todas as dívidas, pelo valor do balanço."
    definicao_tecnica: "Diferença entre ativo e passivo; representa os recursos dos acionistas (capital, reservas, ajustes e lucros acumulados)."
    analogias:
      - texto: "É como o valor de uma casa menos o que ainda falta pagar do financiamento: a parte que é realmente sua."
        limite: "Usa valores contábeis, que podem ser bem diferentes dos valores de mercado."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Patrimônio líquido"
      url: "https://borainvestir.b3.com.br/glossario/patrimonio-liquido/"

  - id: ativo
    termo: ativo
    variantes:
      - ativo total
      - ativos totais
      - ativo circulante
      - ativo não circulante
      - ativo imobilizado
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Conjunto de bens e direitos que a empresa possui, como dinheiro, estoques, prédios e valores a receber."
    definicao_tecnica: "Recurso econômico presente controlado pela entidade como resultado de eventos passados, com potencial de gerar benefícios econômicos; dividido em circulante e não circulante no balanço patrimonial."
    analogias:
      - texto: "É tudo o que entra na lista do que a empresa tem, como na declaração de bens de uma pessoa."
        limite: "Ter muitos ativos não significa estar bem; é preciso olhar as dívidas do outro lado."
        status: rascunho
    ambiguo: true
    fonte:
      nome: "B3, Bora Investir, Glossário: Ativo"
      url: "https://borainvestir.b3.com.br/glossario/ativo/"

  - id: passivo
    termo: passivo
    variantes:
      - passivo total
      - passivo circulante
      - passivo não circulante
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Conjunto das dívidas e obrigações da empresa com terceiros, como fornecedores, bancos e impostos."
    definicao_tecnica: "Obrigação presente da entidade de transferir recursos econômicos como resultado de eventos passados; dividido em circulante (curto prazo) e não circulante no balanço."
    analogias:
      - texto: "É a lista de contas a pagar da empresa, das que vencem logo às de longo prazo."
        limite: "Algumas obrigações são estimadas, como provisões, e podem mudar de valor."
        status: rascunho
    ambiguo: true
    fonte:
      nome: "B3, Bora Investir, Glossário: Passivos"
      url: "https://borainvestir.b3.com.br/glossario/passivos/"

  - id: balanco_patrimonial
    termo: balanço patrimonial
    variantes:
      - balanços patrimoniais
      - demonstrações financeiras
      - demonstrações contábeis
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Relatório que mostra, numa data, o que a empresa tem, o que deve e o que pertence aos sócios."
    definicao_tecnica: "Demonstração da posição patrimonial e financeira em uma data, com ativos, passivos e patrimônio líquido; integra o conjunto completo de demonstrações contábeis com o resultado, os fluxos de caixa e as notas explicativas."
    analogias:
      - texto: "É como uma foto da situação financeira da empresa num dia específico."
        limite: "A foto muda no dia seguinte; para ver o filme do período é preciso olhar o resultado e o fluxo de caixa."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 26 (Apresentação das Demonstrações Contábeis)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=57"

  - id: dre
    termo: demonstração do resultado
    variantes:
      - DRE
      - demonstração do resultado do exercício
      - demonstrações de resultado
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Relatório que mostra quanto a empresa vendeu, gastou e lucrou ou perdeu num período."
    definicao_tecnica: "Demonstração das receitas, custos, despesas, resultado financeiro, tributos e resultado líquido do período, estruturada em linhas definidas pela lei e pelas normas contábeis."
    analogias:
      - texto: "É como o resumo do mês de um negócio: entrou tanto, saiu tanto, sobrou tanto."
        limite: "Usa o regime de competência: mostra o que foi ganho e gasto no período, não necessariamente o dinheiro que entrou e saiu."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 26 (Apresentação das Demonstrações Contábeis)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=57"

  - id: fluxo_de_caixa
    termo: fluxo de caixa
    variantes:
      - fluxos de caixa
      - demonstração dos fluxos de caixa
      - DFC
      - geração de caixa
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Registro do dinheiro que de fato entrou e saiu da empresa num período."
    definicao_tecnica: "Entradas e saídas de caixa e equivalentes; a demonstração dos fluxos de caixa as classifica em atividades operacionais, de investimento e de financiamento."
    analogias:
      - texto: "É como o extrato da conta corrente da empresa: mostra o dinheiro que entrou e saiu, não as promessas."
        limite: "Uma empresa pode ter lucro e fluxo de caixa negativo no mesmo período, e vice-versa."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 03 (Demonstração dos Fluxos de Caixa)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=34"

  - id: tributos_diferidos
    termo: tributos diferidos
    variantes:
      - imposto de renda diferido
      - impostos diferidos
      - ativo fiscal diferido
      - passivo fiscal diferido
      - imposto de renda e contribuição social diferidos
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Impostos sobre o lucro que a contabilidade registra agora, mas que só serão pagos ou recuperados no futuro."
    definicao_tecnica: "Tributos sobre o lucro a pagar (passivo fiscal diferido) ou a recuperar (ativo fiscal diferido) em períodos futuros, decorrentes de diferenças temporárias entre a base contábil e a base fiscal e de prejuízos fiscais compensáveis."
    analogias:
      - texto: "É como anotar hoje um imposto que só vai vencer mais à frente, porque o fato que o gerou já aconteceu."
        limite: "O ativo diferido só vale se houver lucro tributável futuro para usá-lo."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 32 (Tributos sobre o Lucro)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=63"

  - id: aliquota_efetiva
    termo: alíquota efetiva
    variantes:
      - alíquota média efetiva
      - taxa efetiva de imposto
      - alíquotas efetivas
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Parte do lucro que a empresa de fato pagou de imposto sobre o lucro, que pode ser diferente da alíquota prevista em lei."
    definicao_tecnica: "Despesa (receita) tributária sobre o lucro dividida pelo lucro contábil antes dos tributos; difere da alíquota nominal por efeitos como despesas não dedutíveis, incentivos e juros sobre capital próprio."
    analogias:
      - texto: "É como a porcentagem que de fato foi descontada do salário depois de todas as deduções, e não a da tabela."
        limite: "Pode variar muito de um período para outro por efeitos pontuais, então um único trimestre não indica tendência."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 32 (Tributos sobre o Lucro)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=63"

  - id: informacoes_por_segmento
    termo: segmento operacional
    variantes:
      - segmentos operacionais
      - informações por segmento
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Parte do negócio de uma empresa cujos números são acompanhados separadamente pela direção, como uma linha de produtos."
    definicao_tecnica: "Componente da entidade que desenvolve atividades das quais obtém receitas e incorre em despesas, cujos resultados são revistos regularmente pela administração para alocar recursos e avaliar desempenho."
    analogias:
      - texto: "É como um supermercado que acompanha separado o açougue, a padaria e a farmácia para saber qual dá mais resultado."
        limite: "Cada empresa define seus segmentos conforme a gestão interna, então eles podem não ser comparáveis entre empresas."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 22 (Informações por Segmento)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=53"

  - id: demonstracao_intermediaria
    termo: demonstração intermediária
    variantes:
      - demonstrações intermediárias
      - ITR
      - informações trimestrais
      - resultado trimestral
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Relatório financeiro de um período menor que o ano, como um trimestre."
    definicao_tecnica: "Demonstrações contábeis completas ou condensadas de período intermediário, como as informações trimestrais exigidas das companhias abertas."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 21 (Demonstração Intermediária)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=52"

  - id: arrendamento
    termo: arrendamento
    variantes:
      - arrendamentos
      - arrendamento mercantil
      - leasing
      - passivo de arrendamento
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Contrato de uso de um bem de outra pessoa por um tempo, em troca de pagamentos, como aluguel de máquinas ou imóveis."
    definicao_tecnica: "Contrato que transfere o direito de controlar o uso de um ativo identificado por um período em troca de contraprestação; o arrendatário reconhece em geral um ativo de direito de uso e um passivo de arrendamento."
    analogias:
      - texto: "É como alugar um imóvel por muitos anos: na contabilidade, a empresa registra o direito de usar e a dívida dos aluguéis futuros."
        limite: "Contratos curtos ou de baixo valor podem ser tratados de forma simplificada, como despesa do período."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Comitê de Pronunciamentos Contábeis, CPC 06 (Arrendamentos)"
      url: "https://www.cpc.org.br/CPC/Documentos-Emitidos/Pronunciamentos/Pronunciamento?Id=37"

  - id: alavancagem
    termo: alavancagem
    variantes:
      - alavancagem financeira
      - grau de alavancagem
      - endividamento
      - dívida líquida sobre EBITDA
    categoria: contabil
    nivel_minimo: intermediario
    definicao_simples: "Uso de dinheiro emprestado para fazer o negócio crescer, o que pode aumentar tanto os ganhos quanto as perdas."
    definicao_tecnica: "Uso de recursos de terceiros (empréstimos, financiamentos ou derivativos) para potencializar o retorno do capital próprio; costuma ser medida por indicadores de endividamento, como dívida líquida em relação ao EBITDA."
    analogias:
      - texto: "É como usar uma alavanca para levantar um peso maior do que conseguiria sozinho; se escorregar, o tombo também é maior."
        limite: "O risco aumenta com o custo da dívida e com a volatilidade do negócio; não existe nível bom universal."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Alavancagem em empresas"
      url: "https://borainvestir.b3.com.br/glossario/alavancagem-em-empresas/"

  - id: roe
    termo: ROE
    variantes:
      - retorno sobre o patrimônio líquido
      - Return on Equity
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Indicador de quanto lucro a empresa gera para cada real que os sócios têm investido nela."
    definicao_tecnica: "Retorno sobre o patrimônio líquido: lucro líquido do período dividido pelo patrimônio líquido, em percentual."
    analogias:
      - texto: "É como medir quanto rende por ano o dinheiro que você colocou no seu próprio negócio."
        limite: "Pode ficar alto só porque a empresa usa muita dívida, o que também aumenta o risco."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: ROE"
      url: "https://borainvestir.b3.com.br/glossario/roe/"

  - id: valor_patrimonial_por_acao
    termo: valor patrimonial por ação
    variantes:
      - VPA
      - valor patrimonial da ação
      - valor patrimonial
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Parte do patrimônio da empresa, segundo o balanço, que corresponde a cada ação."
    definicao_tecnica: "Patrimônio líquido dividido pela quantidade de ações do capital, excluídas as mantidas em tesouraria."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: roic
    termo: ROIC
    variantes:
      - retorno sobre o capital investido
      - Return on Invested Capital
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Indicador de quanto o negócio rende sobre todo o dinheiro aplicado nele, tanto dos sócios quanto de empréstimos."
    definicao_tecnica: "Retorno sobre o capital investido: resultado operacional após impostos dividido pelo capital total empregado (patrimônio líquido mais dívida financeira)."
    analogias: []
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: ROIC"
      url: "https://borainvestir.b3.com.br/glossario/roic/"

  - id: cagr
    termo: CAGR
    variantes:
      - taxa de crescimento anual composta
    categoria: contabil
    nivel_minimo: avancado
    definicao_simples: "Taxa média de crescimento por ano ao longo de vários anos, considerando que o crescimento se acumula."
    definicao_tecnica: "Taxa composta de crescimento anual que leva o valor inicial ao valor final em um período de vários anos, suavizando as variações anuais."
    analogias: []
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: CAGR"
      url: "https://borainvestir.b3.com.br/glossario/cagr/"
