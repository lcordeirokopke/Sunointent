    definicao_tecnica: "Assembleia de acionistas realizada anualmente nos meses seguintes ao fim do exercício social para tomar as contas dos administradores, votar as demonstrações financeiras, deliberar sobre a destinação do lucro e a distribuição de dividendos e eleger administradores e conselheiros fiscais."
