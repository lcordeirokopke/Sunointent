    definicao_tecnica: "Órgão deliberativo máximo do Sistema Financeiro Nacional, que estabelece as diretrizes das políticas monetária, cambial e creditícia, regula as instituições financeiras e fixa a meta para a inflação e seu intervalo de tolerância."
