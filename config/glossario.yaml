      - rotativo do cartão
      - crédito rotativo
    categoria: atividade
    nivel_minimo: iniciante
    definicao_simples: "Dívida que aparece quando se paga só parte da fatura do cartão de crédito; o restante passa a cobrar juros."
    definicao_tecnica: "Financiamento do saldo devedor remanescente após o vencimento da fatura do cartão de crédito, incluindo saques e pagamentos na função crédito; é modalidade emergencial e de custo elevado."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  # --------------------------------------------------------------- cambio
  - id: taxa_de_cambio
    termo: taxa de câmbio
    variantes:
      - taxas de câmbio
      - câmbio
      - cotação do dólar
    categoria: cambio
    nivel_minimo: iniciante
    definicao_simples: "Preço de uma moeda estrangeira, como o dólar, em reais."
    definicao_tecnica: "Preço de uma moeda estrangeira medido em unidades da moeda nacional; no regime de câmbio flutuante, é formada pela oferta e demanda no mercado de câmbio, com taxas de compra e de venda."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Perguntas frequentes: Taxa de câmbio"
      url: "https://www.bcb.gov.br/acessoinformacao/perguntasfrequentes-respostas/faq_taxacambio"

  - id: cambio_flutuante
    termo: câmbio flutuante
    variantes:
      - regime de câmbio flutuante
      - política cambial
    categoria: cambio
    nivel_minimo: intermediario
    definicao_simples: "Sistema em que o preço do dólar em reais é definido pelo mercado, sem um valor fixado pelo governo."
    definicao_tecnica: "Regime em que a taxa de câmbio é formada pela oferta e demanda de moeda estrangeira, sem limites máximos ou mínimos; o Banco Central atua apenas para conter disfuncionalidades e variações bruscas, por instrumentos como swaps cambiais e leilões de moeda."
    analogias:
      - texto: "É como o preço do tomate na feira: sobe e desce com a procura e a oferta; o Banco Central só intervém se o mercado travar ou as variações ficarem bruscas demais."
        limite: "A intervenção do Banco Central não busca um preço-alvo para o dólar, só suavizar movimentos desordenados."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Perguntas frequentes: Política Cambial"
      url: "https://www.bcb.gov.br/acessoinformacao/perguntasfrequentes-respostas/faq_politicacambialBC"

  - id: depreciacao_cambial
    termo: depreciação cambial
    variantes:
      - câmbio depreciado
      - desvalorização do real
      - desvalorização cambial
      - apreciação cambial
      - valorização do real
      - câmbio apreciado
    categoria: cambio
    nivel_minimo: intermediario
    definicao_simples: "Quando o real perde valor e passa a ser preciso mais reais para comprar um dólar; o contrário é a valorização do real."
    definicao_tecnica: "Perda de valor da moeda nacional frente às estrangeiras (alta da taxa de câmbio); encarece importados e insumos e tende a pressionar a inflação, enquanto a apreciação tem efeito oposto."
    analogias:
      - texto: "Se o real fosse um ingresso de show, depreciação é quando o mesmo ingresso passa a valer menos dólares na troca."
        limite: "A analogia trata só do preço da troca; o efeito sobre a inflação depende de quanto as empresas repassam aos preços."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Perguntas frequentes: Política Monetária"
      url: "https://www.bcb.gov.br/acessoinformacao/perguntasfrequentes-respostas/faq_politicamonetariaBC"

  - id: paridade_do_poder_de_compra
    termo: paridade do poder de compra
    variantes:
      - PPC
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Ideia de que, com o tempo, o câmbio tende a se ajustar à diferença entre a inflação de um país e a dos outros."
    definicao_tecnica: "Teoria que relaciona câmbio e diferencial de inflação; na versão em diferenças, a variação da taxa de câmbio é dada pela diferença entre inflação doméstica e externa. O Copom usa essa hipótese para a trajetória do câmbio nas projeções."
    analogias:
      - texto: "Se no Brasil os preços sobem mais rápido que lá fora, o real tende a perder valor na mesma proporção, para que a mesma cesta continue custando parecido nos dois lugares."
        limite: "É uma tendência de longo prazo e uma hipótese de trabalho; no dia a dia o câmbio se afasta bastante dela por fluxos de capital, juros e risco."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Relatório de Inflação, boxe sobre trajetória da taxa de câmbio nas projeções"
      url: "https://www.bcb.gov.br/content/ri/relatorioinflacao/202009/ri202009b8p.pdf"

  - id: ptax
    termo: PTAX
    variantes:
      - taxa PTAX
      - PTAX800
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Cotação oficial do dólar calculada pelo Banco Central todos os dias, usada como referência em contratos."
    definicao_tecnica: "Taxas de compra e de venda calculadas pelo Banco Central como médias de consultas diárias aos dealers de câmbio; servem de referência para liquidação de contratos e derivativos de câmbio."
    analogias:
      - texto: "É como um preço médio oficial do dia, apurado em várias consultas aos principais negociantes, que serve de régua para contratos."
        limite: "Ninguém compra dólar no balcão pela PTAX; o preço que cada cliente paga inclui custos e margens."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: reservas_internacionais
    termo: reservas internacionais
    variantes:
      - reservas cambiais
    categoria: cambio
    nivel_minimo: intermediario
    definicao_simples: "Dinheiro e bens em moeda estrangeira guardados pelo Banco Central, como um seguro do país para pagar compromissos com o exterior."
    definicao_tecnica: "Ativos em moeda estrangeira mantidos pelo Banco Central (depósitos, títulos, direitos especiais de saque, ouro); funcionam como seguro para obrigações externas e permitem atuar contra variações bruscas do câmbio."
    analogias:
      - texto: "São como a reserva de emergência de uma família, só que em dólar e para o país inteiro."
        limite: "Manter reservas tem custo, e usá-las para segurar o câmbio só funciona por algum tempo; não são dinheiro livre para gastos do governo."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Perguntas frequentes: Política Cambial"
      url: "https://www.bcb.gov.br/acessoinformacao/perguntasfrequentes-respostas/faq_politicacambialBC"

  - id: swap_cambial
    termo: swap cambial
    variantes:
      - swaps cambiais
      - swap cambial reverso
      - swaps cambiais reversos
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Contrato do Banco Central que protege o mercado contra a alta do dólar sem que ele precise vender dólares de verdade."
    definicao_tecnica: "Derivativo padronizado em que o Banco Central paga a variação do dólar acrescida do cupom cambial e recebe a variação da Selic acumulada (no reverso, o oposto); oferece proteção cambial ao mercado e suaviza variações bruscas."
    analogias:
      - texto: "É como vender um seguro contra a alta do dólar: quem compra fica protegido, e o Banco Central paga a diferença se o dólar subir."
        limite: "Se o dólar cair, quem paga é o comprador do contrato; e o contrato é liquidado em reais, sem entrega de dólares."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Perguntas frequentes: Política Cambial"
      url: "https://www.bcb.gov.br/acessoinformacao/perguntasfrequentes-respostas/faq_politicacambialBC"

  - id: hedge_cambial
    termo: hedge cambial
    variantes:
      - proteção cambial
      - proteção contra variação cambial
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Proteção contratada para não perder dinheiro com a subida ou a descida do dólar."
    definicao_tecnica: "Proteção contra variações da taxa de câmbio por meio de swaps, outros derivativos de câmbio ou compra e venda de ativos referenciados em moeda estrangeira, conforme a exposição do agente."
    analogias:
      - texto: "É como travar o preço da passagem de uma viagem futura: se o dólar subir, não faz diferença para quem já travou."
        limite: "Se o dólar cair, quem travou deixa de ganhar com a queda; a proteção tem custo e elimina o risco nos dois sentidos."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: risco_pais
    termo: risco-país
    variantes:
      - risco país
      - risco soberano
      - EMBI
      - EMBI+
      - Embi+Br
    categoria: cambio
    nivel_minimo: intermediario
    definicao_simples: "Medida de quanto os investidores de fora acham arriscado emprestar dinheiro ao país."
    definicao_tecnica: "Conceito que expressa o risco de crédito a que investidores estrangeiros estão sujeitos ao aplicar no país; costuma ser medido pelo spread de títulos da dívida externa soberana sobre títulos considerados livres de risco, como no índice EMBI+."
    analogias:
      - texto: "É como o juro extra que um banco cobra de quem tem nome sujo: quanto maior a desconfiança, maior o prêmio exigido."
        limite: "O risco-país oscila também com o humor global, não só com a situação do próprio país."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: carry_trade
    termo: carry trade
    variantes:
      - diferencial de juros
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Estratégia de pegar dinheiro emprestado onde os juros são baixos e aplicar onde os juros são altos, ganhando a diferença."
    definicao_tecnica: "Estratégia de tomar recursos em moeda com juros baixos para aplicar em ativos de outra moeda com juros mais altos, capturando o diferencial de juros; fica exposta ao risco cambial."
    analogias:
      - texto: "É como pegar emprestado com um parente que cobra pouco e aplicar num banco que paga mais: o ganho é a diferença."
        limite: "Se a moeda do país de juros altos cair, a perda no câmbio pode apagar todo o ganho de juros."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: Carry Trade"
      url: "https://borainvestir.b3.com.br/glossario/carry-trade/"

  - id: balanco_de_pagamentos
    termo: balanço de pagamentos
    variantes:
      - transações correntes
      - conta corrente do balanço de pagamentos
      - conta financeira
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Registro de todo o dinheiro que entra e sai do país nas relações com o exterior, como comércio, serviços e investimentos."
    definicao_tecnica: "Registro estatístico das transações entre residentes e não residentes, agrupado em transações correntes, conta capital, conta financeira, erros e omissões e resultado global."
    analogias:
      - texto: "É como o extrato bancário do país com o resto do mundo: mostra tudo que entrou e saiu, separado por tipo."
        limite: "Ao contrário de um extrato, ele sempre fecha por construção contábil; o que importa é a composição de cada conta."
        status: rascunho
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: investimento_estrangeiro_direto
    termo: investimento estrangeiro direto
    variantes:
      - IED
      - investimento direto no país
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Dinheiro que estrangeiros colocam em empresas e negócios no país com intenção de longo prazo."
    definicao_tecnica: "Componente da conta financeira do balanço de pagamentos que registra investimentos de não residentes em empresas no país, com participação duradoura no capital."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: fomc
    termo: FOMC
    variantes:
      - Federal Reserve
      - Fed
      - Fed funds
      - Federal Open Market Committee
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Comitê do banco central dos Estados Unidos que decide os juros americanos, com efeito sobre o dólar e os mercados do mundo todo."
    definicao_tecnica: "Comitê do Federal Reserve responsável pela política monetária dos Estados Unidos, que define a meta para a taxa dos Fed funds, juro dos empréstimos de reservas entre bancos americanos."
    analogias: []
    ambiguo: false
    fonte:
      nome: "B3, Bora Investir, Glossário: FOMC"
      url: "https://borainvestir.b3.com.br/glossario/fomc-federal-open-market-committee/"

  - id: treasuries
    termo: Treasuries
    variantes:
      - US Treasuries
      - títulos do Tesouro americano
      - Treasury
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Papéis de dívida do governo dos Estados Unidos, considerados uma das aplicações mais seguras do mundo."
    definicao_tecnica: "Títulos de renda fixa emitidos pelo Tesouro dos EUA (bills, notes e bonds, conforme o prazo); seus rendimentos são referência global para precificação de ativos."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: cupom_cambial
    termo: cupom cambial
    variantes:
      - cupons cambiais
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Juro de aplicações em reais que acompanham o dólar."
    definicao_tecnica: "Taxa de juros de aplicações referenciadas em dólar cotada no mercado doméstico; aproximadamente, o diferencial entre o juro em reais e a expectativa de desvalorização do real."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: taxa_de_cambio_real_efetiva
    termo: taxa de câmbio real efetiva
    variantes:
      - câmbio real efetivo
      - câmbio real
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Medida do valor do real frente às moedas dos principais parceiros comerciais, descontadas as diferenças de inflação."
    definicao_tecnica: "Medida de competitividade das exportações dada pela cotação do real em relação às moedas dos principais mercados de destino, ponderada pela participação de cada um nas exportações e ajustada por inflação."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  - id: exposicao_cambial
    termo: exposição cambial
    variantes:
      - exposições cambiais
    categoria: cambio
    nivel_minimo: avancado
    definicao_simples: "Quanto uma empresa ou instituição pode ganhar ou perder se o dólar ou outra moeda estrangeira mudar de preço."
    definicao_tecnica: "Total de posições em ouro, moeda estrangeira e ativos e passivos referenciados em variação cambial mantidas por uma instituição."
    analogias: []
    ambiguo: false
    fonte:
      nome: "Banco Central do Brasil, Glossário"
      url: "https://www.bcb.gov.br/acessoinformacao/glossario"

  # --------------------------------------------------------------- fiscal
  - id: resultado_primario
    termo: resultado primário
    variantes:
      - superávit primário
      - déficit primário
      - superávits primários
      - déficits primários
      - meta de resultado primário
    categoria: fiscal
    nivel_minimo: avancado
    definicao_simples: "Diferença entre o que o governo arrecada e o que gasta, sem contar os juros da dívida; se sobra, há superávit; se falta, déficit."
    definicao_tecnica: "Resultado nominal do setor público (necessidade de financiamento) excluídos os juros nominais incidentes sobre a dívida líquida; indica o esforço fiscal corrente, independente do custo da dívida acumulada."
    analogias:
      - texto: "É como o orçamento de uma família olhando só salário e despesas do mês, sem contar os juros das dívidas antigas: mostra se a família está gastando mais do que ganha."
        limite: "Um superávit primário pode não bastar para reduzir a dívida se os juros forem altos; o resultado completo inclui os juros."
