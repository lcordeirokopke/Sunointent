# Calibração do juiz (M6): peças escritas à mão sobre os claims de tests/fixtures/referencia/<fonte>.claims.json,
# com o texto final (números já no lugar dos marcadores). Metade é fiel aos claims; a outra metade tem um erro
# plantado numa unidade (`unidade_erro`), de um destes tipos:
# - analogia_errada: a analogia explica o conceito de forma errada;
# - causa_inventada: relação de causa que os claims não dizem, ou que contradiz o documento;
# - projecao_como_fato: projeção ou previsão escrita como fato consumado, sem atribuição à fonte;
# - numero_por_extenso: número escrito por extenso diferente do número do claim.
# O plano do nível de cada peça usa os claims citados nas unidades e as `analogias` dadas.
versao: 1
pecas:
  - id: copom-iniciante-artigo-ok
    fonte: copom
    nivel: iniciante
    formato: artigo
    erro: null
    analogias:
      - termo: Selic
        explicacao: "É como o juro de referência que o Banco Central define para os empréstimos entre bancos: quando ele sobe, os juros cobrados de pessoas e empresas tendem a subir junto."
    payload:
      titulo: "Banco Central corta os juros, mas a inflação segue no radar"
      linha_fina: "O que a decisão desta semana muda no seu bolso"
      secoes:
        - texto: "O Banco Central reduziu a Selic para 13,75% ao ano. A Selic é como o juro de referência que o Banco Central define para os empréstimos entre bancos: quando ela cai, os juros cobrados de pessoas e empresas tendem a cair junto."
          claim_ids: [C27]
        - texto: "A inflação, que é a alta dos preços, perdeu força nas divulgações mais recentes. Ela ficou abaixo do limite superior do intervalo de tolerância, mas ainda acima da meta."
          claim_ids: [C03]
        - texto: "Para frente, o Banco Central projeta que a inflação acumulada em 2026 fique em 5,2%. Na prática, é uma estimativa do próprio Banco Central, e não um resultado garantido."
          claim_ids: [C18]

  - id: copom-iniciante-artigo-analogia
    fonte: copom
    nivel: iniciante
    formato: artigo
    erro: analogia_errada
    unidade_erro: 0
    analogias:
      - termo: Selic
        explicacao: "É como o preço do dólar: quando ela cai, o dólar fica mais barato para quem vai viajar."
    payload:
      titulo: "Banco Central corta os juros, mas a inflação segue no radar"
      linha_fina: "O que a decisão desta semana muda no seu bolso"
      secoes:
        - texto: "O Banco Central reduziu a Selic para 13,75% ao ano. A Selic é como o preço do dólar: quando ela cai, o dólar fica mais barato para quem vai viajar."
          claim_ids: [C27]
        - texto: "A inflação, que é a alta dos preços, perdeu força nas divulgações mais recentes. Ela ficou abaixo do limite superior do intervalo de tolerância, mas ainda acima da meta."
          claim_ids: [C03]
        - texto: "Para frente, o Banco Central projeta que a inflação acumulada em 2026 fique em 5,2%. Na prática, é uma estimativa do próprio Banco Central, e não um resultado garantido."
          claim_ids: [C18]

