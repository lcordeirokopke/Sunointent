          claim_ids: [C35]
        - papel: corpo
          texto: "A empresa vai dividir R$1.106,0 milhões com quem tem ações dela, em juros sobre capital próprio. É como um primo do dividendo: também reparte o lucro com os sócios, mas por outra porta, com efeito diferente no imposto."
