# Configuração do Supabase CLI para desenvolvimento local (supabase start / supabase db reset).
# Os valores não listados aqui usam o padrão do CLI.

project_id = "sunontent"

[api]
enabled = true
port = 54321
# public e storage são sempre expostos.
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
# Igual ao major do Postgres do projeto do site.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
# Limite da E0: documento maior que 50 MiB (52.428.800 bytes) é erro terminal (docs/fluxos/ingestao.md).
# É o limite por arquivo do plano Free do Supabase hospedado.
file_size_limit = "50MiB"

[auth]
# O dashboard não usa o Supabase Auth: roda no servidor e acessa o banco com o service role.
enabled = true
